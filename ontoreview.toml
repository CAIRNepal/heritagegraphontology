# OntoReview documentation for HeritageGraph (https://pypi.org/project/ontoreview/).
# scripts/build.sh runs `ontoreview build` with this file; it passes the output
# folder, the ROBOT executable and the previous release (from owl:priorVersion).
source = "ontology/HeritageGraph.ttl"
output = "docs"
layout = "multi"
languages = ["en"]
base_url = "https://cairnepal.github.io/heritagegraphontology/"
introduction = "docs-src/introduction.md"
serializations = ["ttl", "owl", "jsonld", "nt"]

[sections]
graph = true
quality = true
changelog = true

[evaluation]
robot = "auto"
oops = "auto"
reasoner = "hermit"
ontocheck = "on"
iri_checks = "on"

[metadata]
abstract = """HeritageGraph is an event-centric OWL ontology for describing Nepalese living heritage — its tangible objects, sacred places, deities, rituals, festivals, and the communities and institutions (notably the *Guthi*) that sustain them. Rather than attaching facts directly to objects, the model represents history as a web of events (production, ritual, custody transfer, documentation) so that spatial, temporal, and participatory relationships can be queried and reasoned over. Every assertion can carry its provenance and epistemic standing, allowing competing or multi-vocal sources to coexist. The ontology is generated from a LinkML schema, is an OWL 2 DL vocabulary that is logically consistent under the HermiT reasoner, and is aligned with CIDOC-CRM 7.1.3, CRMinf, CRMsci, and PROV-O, and through a companion module with Linked Art, to maximise interoperability with the wider cultural-heritage Linked Data cloud."""

[[custom_sections]]
title = "Description"
file = "docs-src/description.md"
position = "before-terms"

[[custom_sections]]
title = "References"
file = "docs-src/references.md"
position = "after-terms"
