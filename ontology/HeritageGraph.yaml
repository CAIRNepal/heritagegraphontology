      crm_superclass: crm:E24_Physical_Human-Made_Thing

  # ========================================================================
  # CONCEPTUAL ENTITIES (CIDOC E28 Conceptual Objects)
  # ========================================================================

    mixins:
      - Entity
  PhysicalHeritageThing:
    class_uri: heritageGraph:PhysicalHeritageThing
    description: "Union of the tangible heritage classes: architectural structures, iconographic
      objects, and standalone architectural elements. Used as the range of slots that apply to any
      physical heritage thing (production, custody, condition assessment)."
    union_of:
      - ArchitecturalStructure
      - IconographicObject
      - ArchitecturalElement


    mixins:
      - Entity
    annotations:
      disjoint_kind: physical
  Deity:
    # URI POLICY (alpha.5): narrower than the CRM class; IRI minted,
    # CRM identity moved to broad_mappings.
    class_uri: heritageGraph:Deity
    broad_mappings:
      - crm:E28_Conceptual_Object
    description: "Divine conceptual entity in Hindu, Buddhist, or syncretic traditions. Distinct from physical representations
      (Murti) and ritual presences."
    # 1.1.0 (M19): aat:300343850 'deities' sits in the AAT People/Agents facet
    # ("people in religion") and dbo:Deity is a dbo:Agent; HeritageGraph's Deity
    # is a conceptual entity (distinct from persons and images): close matches.
    # (MAPPING AUDIT alpha.5: aat:300343156 does not exist; aat:300343850 verified.)
    close_mappings:
      - aat:300343850
      - dbo:Deity
      # (Wikidata's 'deity' is likewise a kind of supernatural being, not a
      # conceptual entity: a close match too)
      # URI FIX (alpha.5): schema:Deity does not exist (schema.org defines no
      # Deity type); replaced with the Wikidata concept 'deity' (Q178885).
      - wikidata:Q178885
    slots:
      - name
      - note
      - has_religious_tradition
      - is_depicted_in
      - is_invoked_in_ritual
      - is_enshrined_through_event
    mixins:
      - Entity
    annotations:
      disjoint_kind: concept
  ReligiousTradition:
    # URI POLICY (alpha.5): narrower than the CRM class; IRI minted,
    # CRM identity moved to broad_mappings.
    class_uri: heritageGraph:ReligiousTradition
    broad_mappings:
      - crm:E55_Type
    description: "Religious or philosophical tradition (e.g., Hindu, Buddhist, Syncretic)"
    exact_mappings:
      - aat:300073708
    slots:
      - name
      - note
    mixins:
      - Entity
    annotations:
      disjoint_kind: concept
      crm_superclass: crm:E55_Type
  HistoricalEvent:
    # URI POLICY (alpha.5): narrower than the CRM class; IRI minted,
    # CRM identity moved to broad_mappings.
    class_uri: heritageGraph:HistoricalEvent
    broad_mappings:
      - crm:E5_Event
    description: "Major event affecting heritage structures or ritual life (earthquake, epidemic, political transition,
      fire, flood)."
    slots:
      - name
      - note
      - has_timespan
      - took_place_at
      - architectural_structures
    # 1.1.0: includes_ritual_event (crm:P9, range RitualEvent) removed here: a
    # crisis ritual is motivated by the event (motivated_by, P17), not part of
    # it, and the parts of a historical event (e.g. a collapse, a destruction)
    # are not rituals. Festivals keep it.
    annotations:
      disjoint_kind: event
      crm_superclass: crm:E5_Event
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  CalendarSystem:

    # URI FIX (alpha.5): time:Calendar does not exist in OWL-Time, and
    # crm:E29_Designated_Reference_System does not exist in CIDOC-CRM (E29 is
    # Design or Procedure). A calendar is a temporal reference system, which
    # OWL-Time models as time:TRS. The class IRI is now minted under
    # heritageGraph; the official OWL-Time term is retained as the mapping.
    class_uri: heritageGraph:CalendarSystem
    # MAPPING AUDIT (alpha.5): a calendar is one kind of temporal reference
    # system (time:TRS also covers clocks and coordinate systems) -> demoted
    # from exact to broad.
    broad_mappings:
      - time:TRS
    description: "Calendar reckoning system with conversion rules for multi-calendar temporal reasoning"
    slots:
      - name
      - epoch_date_gregorian
      - is_primary_for_tradition
      - year_offset_from_gregorian
      - note
    slot_usage:
      name:
        required: true
    annotations:
      disjoint_kind: concept

