  Group:
    is_a: Actor
    class_uri: crm:E74_Group
    abstract: true
    description: "Group of people acting together (CIDOC-CRM E74 Group): the common superclass of Guthi and
      CasteGroup."
  Guthi:
    # URI POLICY (alpha.5): narrower than the CRM class; IRI minted,
