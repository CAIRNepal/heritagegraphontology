    description: "Categorization of the condition state"



  assessed_object:
    slot_uri: crm:P34_concerned
    range: PhysicalHeritageThing
    description: "Object assessed for condition"

  assessed_condition_state:
    slot_uri: crm:P35_has_identified
    range: ConditionState
    description: "Condition state identified by the assessment"

 

  epoch_date_gregorian:
    slot_uri: heritageGraph:epochDateGregorian
    range: string
    pattern: "^-?[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
    description: "Proleptic Gregorian (ISO 8601, astronomical year numbering) date on which the era began, in the
      era's own reckoning (Bikram Sambat counts from year 1, e.g. -0056-04-14, a nominal back-projection of the modern
      solar reckoning rather than an attested date; Nepal Sambat counts elapsed years
      from year 0, 0879-10-24 = 20 October 879 Julian). Its month and day only indicate the approximate new-year
      season: the actual new year varies (Bikram Sambat 13-15 April, solar; Nepal Sambat late October to November,
      lunisolar), so it must not be used for day-level conversion. A value ending in -01-01 marks a calendar whose
      new year is 1 January, for which year conversion is exact."
    annotations:
      lexical_form: code

  year_offset_from_gregorian:
    slot_uri: heritageGraph:yearOffsetFromGregorian
    range: integer
    description: "Number of years this calendar runs ahead of the Gregorian (Common Era) year at the start of its
      year (e.g. 57 for Bikram Sambat, -879 for Nepal Sambat). Because the calendar's new year does not fall on
      1 January (see epoch_date_gregorian), a year-precision date Y converts to the two-year interval
      [Y - offset, Y - offset + 1] CE; the single year Y - offset is correct only for dates between the calendar's
      new year and 31 December. A calendar whose new year is 1 January converts to Y - offset exactly."
  date_precision:
    title: "has date precision"
    slot_uri: heritageGraph:datePrecision
    range: DatePrecision
    description: "The level of precision for a recorded date."

  # --- COMPONENTS ---

  has_component:
    slot_uri: crm:P46_is_composed_of
    range: ArchitecturalElement
    # CONSTRAINT FIX (alpha.5): a structure has many components; the slot was
    # accidentally single-valued.
    multivalued: true

    description: "Architectural elements composing structure"

  has_architectural_style:
    slot_uri: heritageGraph:hasArchitecturalStyle
    is_a: has_type
    range: ArchitecturalStyle
    description: "Architectural style classification"

  # --- PROVENANCE (PROV-O aligned with CIDOC) ---
  was_derived_from:
    slot_uri: prov:wasDerivedFrom
    range: Entity
    multivalued: true
    description: Entity from which this entity was derived.
  was_attributed_to:
    slot_uri: prov:wasAttributedTo
    range: Agent
    multivalued: true
    description: Agent to whom responsibility for this entity is attributed.
  was_generated_by:
    slot_uri: prov:wasGeneratedBy
    range: Activity
    description: Activity that generated this entity.
    inverse: generated
  generated_at_time:
    slot_uri: prov:generatedAtTime
    range: datetime
    description: "Time at which this entity was generated (ISO 8601)."


  used:
    slot_uri: prov:used
    range: Entity
    multivalued: true
    description: Entity used by this activity.
  generated:
    slot_uri: prov:generated
    range: Entity
    multivalued: true
    description: Entity generated by this activity.
    inverse: was_generated_by
  was_associated_with:
    slot_uri: prov:wasAssociatedWith
    range: Agent
    multivalued: true
    description: Agent associated with responsibility for this activity.
  was_informed_by:
    slot_uri: prov:wasInformedBy
    range: Activity
    multivalued: true
    description: Activity that informed this activity; PROV-O uses this when the intervening generated and used entity is unknown or omitted.
  was_influenced_by:
    slot_uri: prov:wasInfluencedBy
    any_of:
      - range: Entity
      - range: Activity
      - range: Agent
    multivalued: true
    description: General PROV-O influence relation. Prefer a more specific PROV relation whenever one applies.
  started_at_time:
    slot_uri: prov:startedAtTime
    range: datetime
    description: Time at which this activity started.
  ended_at_time:
    slot_uri: prov:endedAtTime
    range: datetime
    description: Time at which this activity ended.
  acted_on_behalf_of:
    slot_uri: prov:actedOnBehalfOf
    range: Agent
    multivalued: true
    description: Agent on whose behalf this agent acted.
  supersedes_assertion:
    slot_uri: prov:wasRevisionOf
    range: Assertion
    description: "Previous assertion that this one revises (version chain A1->A2->A3). Uses prov:wasRevisionOf (a
      derivation between entities); the latest assertion is the one with no incoming wasRevisionOf. NOTE: prov:invalidated
      was incorrect here (it is an Activity->Entity relation, not Entity->Entity)."

  institutional_affiliation:
    slot_uri: heritageGraph:institutionalAffiliation
    range: string
    description: "Institutional affiliation (e.g., Tribhuvan University, Nepal Heritage Society)"

  expertise_area:
    slot_uri: heritageGraph:expertiseArea
    range: string
    multivalued: true
    description: "Areas of expertise (e.g., Licchavi inscriptions, Sanskrit epigraphy, Newari archaeology)"

  used_method:
    # CRM D/R FIX (alpha.5): P33's range is E29 Design or Procedure (an
    # object), but this slot is a free-text note; CRM has no literal-valued
    # technique property. Minted. (P33 now belongs to used_technique.)
    slot_uri: heritageGraph:usedMethod
    range: string
    description: "Documentation method used"

  used_equipment:
    # CRM D/R FIX (alpha.5): P16_used_specific_object is an object property
    # (range E70 Thing); using it with literal values is invalid OWL. Minted
    # literal-valued property instead.
    slot_uri: heritageGraph:usedEquipment
    range: string
    multivalued: true
    description: "Equipment used in documentation"

  # --- ASSERTION-LEVEL PROVENANCE ---

  assertion_content:
    slot_uri: prov:value
    range: string
    description: "The factual claim being asserted"

  asserts_proposition:
    slot_uri: crminf:J4_that
    range: Proposition
    multivalued: true
    description: "Machine-readable proposition(s) this assertion holds to be
      true (CRMinf J4 that). Complements the free-text assertion_content."

  proposition_subject:
    # DL FIX (alpha.6): rdf:subject/predicate/object are RDF reserved
    # vocabulary; OWL 2 DL forbids (re)declaring them as properties, which
    # made every generated artifact OWL Full. Minted heritageGraph IRIs
    # instead; the reification intent (rdf:Statement) stays documented via
    # the Proposition class close_mappings. No instance data used the old
    # IRIs (checked examples/*.ttl before the rename).
    slot_uri: heritageGraph:propositionSubject
    range: AssertionSubject
    description: "Entity the proposition is about (plays the role of rdf:subject)."

  proposition_predicate:
    slot_uri: heritageGraph:propositionPredicate
    range: uriorcurie
    description: "Property (URI/CURIE) claimed of the subject, e.g. crm:P108i_was_produced_by
      (plays the role of rdf:predicate)."

  proposition_object_entity:
    slot_uri: heritageGraph:propositionObjectEntity
    range: AssertionSubject
    description: "Object of the proposition when it is a heritage entity (plays the role of rdf:object)."

  proposition_object_literal:
    slot_uri: heritageGraph:propositionLiteralValue
    range: string
    description: "Object of the proposition when it is a literal value (e.g. a date)."
    annotations:
      lexical_form: any_literal

  source_language:
    # CRM D/R FIX (alpha.5): P72_has_language has domain E33 Linguistic Object
    # and object range E56 Language; used here on DataSource with a literal.
    # schema:inLanguage officially admits Text values on any resource.
    slot_uri: schema:inLanguage
    range: string
    description: "Language of the source material"
    annotations:
      lexical_form: code

  confidence_score:
    slot_uri: heritageGraph:confidenceScore
    # CRMinf records the belief value with J5 holds to be (an object property
    # to I6 Belief Value); this datatype score is a numeric counterpart, so it
    # is related to J5, not a subproperty of it.
    related_mappings:
      - crminf:J5_holds_to_be
    # DATATYPE FIX: xsd:decimal, so the OWL range is ONE facet-restricted
    # datatype, decimal[>= 0, <= 1] (see finalize_alpha5_artifacts.py); float
    # with LinkML's integer-typed bounds produced an empty range.
    range: decimal
    # CONSTRAINT FIX (alpha.5): the 0.0-1.0 range promised in prose is now
    # machine-enforced.
    minimum_value: 0
    maximum_value: 1
    description: "Degree of belief, between 0 and 1, that the asserted value is correct: 1 = certain, 0.5 = undecided,
      0 = believed false. The assessor is either the agent the assertion is attributed to (prov:wasAttributedTo) or
      the activity that generated the assertion (prov:wasGeneratedBy), e.g. an extraction that codes how firmly the
      source states the claim; confidence_method says which, and by what rubric. Scores are comparable only when
      they share an assessor or a method."

  confidence_method:
    slot_uri: heritageGraph:confidenceMethod
    # a link to a documented procedure (crm:E29 Design or Procedure, the
    # Technique class), so a rubric is described once instead of being
    # repeated as text on every assertion
    range: Technique
    description: "The documented procedure (crm:E29 Design or Procedure) by which the confidence score was assigned,
      described once (e.g. an expert 5-point scale mapped to 0-1, agreement between independent sources, or coding of
      the source's hedging: 0.9 stated plainly, 0.7 mild hedging, 0.5 explicitly uncertain, 0.3 disputed by the
      author)."

  data_quality_note:
    slot_uri: heritageGraph:dataQualityNote
    range: string
    description: "Notes on data quality, completeness, or uncertainty"

  reconciliation_status:
    slot_uri: heritageGraph:reconciliationStatus
    range: string
    # CONTROLLED VALUES (1.1.0): the three values were only listed in prose;
    # now enforced (SHACL sh:pattern, JSON Schema pattern). Kept as a string so
    # existing data ("unverified", "conflicting") stays valid.
    pattern: "^(confirmed|conflicting|unverified)$"
    description: "Status of multi-source reconciliation of the asserted value: confirmed (independent sources agree),
      conflicting (sources disagree; see the competing assertions), or unverified (single source, not yet checked)."
    annotations:
      lexical_form: code

  # --- VERIFICATION ---

  verification_method:
    slot_uri: heritageGraph:verificationMethod
    range: string
    description: "Method used for verification (cross-check, expert review, field visit)"
  verified_assertion:
    slot_uri: heritageGraph:verifiedAssertion
    range: Assertion
    multivalued: true
    description: "Assertions verified by this activity"
  verified_by_expert:
    slot_uri: heritageGraph:verifiedByExpert
    is_a: carried_out_by
    range: Person
    multivalued: true
    description: "Expert who performed verification"
  source_citation:
    slot_uri: heritageGraph:sourceCitation
    # 1.1.0: no longer a subproperty of crm:P3 has note (a citation identifies
    # the source rather than commenting on it)
    related_mappings:
      - crm:P3_has_note
    range: string
    description: "Formal citation of source"
  source_url:
    slot_uri: heritageGraph:sourceUrl
    range: string
    description: "URL or digital identifier for source"
    annotations:
      lexical_form: code
  custodian_type:
    # DL FIX (alpha.6): dropped is_a has_type (same rationale as place_type:
    # a string slot cannot be a subproperty of object property crm:P2).
    slot_uri: heritageGraph:custodianType
    range: string
    description: "Type of custodian (government, academic, community), free text"

  carried_out_activity:
    slot_uri: crm:P14i_performed
    range: RitualEvent
    multivalued: true
    description: "Activities performed by this actor"

  was_present_at:
    slot_uri: crm:P12i_was_present_at
    range: RitualEvent
    multivalued: true
    description: "Generic CRM presence relation (P12i): event this entity was present at. Canonical
      holder of the CRM predicate; use the specific slots in data."

  participates_in_ritual:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of the canonical
    # crm:P12i holder was_present_at.
    slot_uri: heritageGraph:participatesInRitual
    is_a: was_present_at
    range: RitualEvent
    multivalued: true
    description: "Rituals in which this structure participates"

  was_documented_by:
    slot_uri: heritageGraph:documentedBy
    range: DocumentationActivity
    multivalued: true
    description: "Documentation event that recorded this (pre-existing) entity or event. Uses hg:documentedBy
      (aligned to prov:wasInfluencedBy). NOTE: prov:wasGeneratedBy was incorrect: a stupa is not *generated by*
      the survey that records it."
    is_a: was_influenced_by
    # 1.1.0 (M19): CIDOC's idiom for a survey recording something is the CRMsci
    # observation (O8 observed); the LUX module now states the same match
    close_mappings:
      - crmsci:O8i_was_observed_by


  ###########################################################################
  #      DATA CITE IDENTIFIER TYPES ENUMERATION
  ##########################################################################
    annotations:
      prov_alignment: prov:wasInfluencedBy
    inverse: documents
  datacite_identifier:
    # URI FIX (alpha.5): datacite:identifier does not exist in the SPAR DataCite
    # ontology (its identifier property, datacite:hasIdentifier, is object-valued
    # via a datacite:Identifier node, not literal-valued). dcterms:identifier is
    # already the URI of the 'id' slot and reusing it would merge the two
    # predicates in RDF. A heritageGraph IRI is minted instead.
    slot_uri: heritageGraph:persistentIdentifier
    range: string
    description: "Persistent identifier for the source (DOI, archive ID, catalog number)"
    annotations:
      lexical_form: code

  datacite_identifier_type:
    # URI FIX (alpha.5): datacite:identifierType does not exist in SPAR DataCite;
    # the official pattern is object-valued datacite:usesIdentifierScheme. No
    # literal-valued official term exists, so a heritageGraph IRI is minted.
    slot_uri: heritageGraph:identifierScheme
    range: string
    description: "Type of identifier (DOI, ISBN, Handle, LocalArchiveID)"
    annotations:
      lexical_form: code

  datacite_creator:
    # URI FIX (alpha.5, revised): dcterms:creator is ALSO used as ontology-header
    # metadata; declaring it both ObjectProperty (slot) and AnnotationProperty
    # (header) is illegal punning in OWL 2 DL (flagged by Protege/HermiT).
    # Minted IRI with dcterms:creator kept as an exact mapping.
    slot_uri: heritageGraph:sourceCreator
    title: "source creator"
    exact_mappings:
      - dcterms:creator
    range: Actor
    multivalued: true
    description: "Person or organization primarily responsible for creating the source"

  datacite_publisher:
    # URI FIX (alpha.5, revised): same punning issue as datacite_creator;
    # minted IRI with dcterms:publisher as an exact mapping.
    slot_uri: heritageGraph:sourcePublisher
    exact_mappings:
      - dcterms:publisher
    range: Actor
    description: "Entity responsible for making the source available"

  datacite_resource_type:
    # URI FIX (alpha.5): datacite:resourceType does not exist in SPAR DataCite
    # ('resourceTypeGeneral' is a DataCite kernel XML field with no RDF form).
    # A heritageGraph IRI is minted; consider dcterms:type with a controlled
    # class value in a future revision.
    slot_uri: heritageGraph:resourceType
    range: string
    description: "High-level DataCite resource type (Dataset, Text, Image, Audio, Interview)"
    annotations:
      lexical_form: code
  documents:
    slot_uri: heritageGraph:documents
    # labelled "records": "documents" is the label of crm:P70, which links a
    # document (an information object) to what it documents; this links a
    # documentation activity to what it recorded
    title: "records"
    related_mappings:
      - crm:P70_documents
    range: AssertionSubject
    multivalued: true
    inverse: was_documented_by
    description: Pre-existing heritage entity or event recorded by this documentation activity (inverse of 
      was_documented_by).
  bounds_tenure:
    slot_uri: heritageGraph:boundsTenure
    range: KumariTenure
    # KUMARI WIRING (alpha.5): no longer globally required -- it double-
    # mandated the same fact next to initiated_tenure/ended_tenure_of, which
    # are now its specializations. Each concrete lifecycle event requires
    # exactly one tenure edge via slot_usage.
    description: The KumariTenure period that this lifecycle event bounds (initiates or terminates). Specialized
      by initiated_tenure (selection) and ended_tenure_of (retirement).
  role_deity:
    slot_uri: heritageGraph:roleDeity
    range: Deity
    description: Deity embodied by whoever holds this role (e.g., Taleju).
  enthroned_person:
    slot_uri: heritageGraph:enthronedPerson
    range: Person
    description: "Girl enthroned as Kumari by this enthronement event."
  confers_role:
    slot_uri: heritageGraph:confersRole
    range: KumariRole
    description: "KumariRole conferred by this selection or enthronement event."
  assesses_candidate:
    slot_uri: heritageGraph:assessesCandidate
    range: Person
    description: Candidate being assessed.
  part_of_selection:
    slot_uri: heritageGraph:partOfSelection
    range: KumariSelectionEvent
    description: Selection event this assessment is part of.
  has_criterion:
    slot_uri: heritageGraph:hasCriterion
    range: SelectionCriterion
    description: Eligibility criterion applied in this selection.
    multivalued: true
  # KUMARI WIRING (alpha.5): results_in_role deleted -- two names existed for
  # "yields this role" on sibling events; unified on confers_role.
  assumes_role:
    is_a: tenure_office
    slot_uri: heritageGraph:assumesRole
    range: KumariRole
    description: KumariRole held during this tenure.
  selected_through:
    slot_uri: heritageGraph:selectedThrough
    range: KumariSelectionEvent
    description: "Selection event that preceded this tenure. Not a tenure-opening event: the tenure opens with
      the enthronement (enthroned_through, a subproperty of tenure_opened_by)."
    inverse: initiated_tenure
  enthroned_through:
    is_a: tenure_opened_by
    slot_uri: heritageGraph:enthronedThrough
    range: KumariEnthronementEvent
    description: Enthronement event that activated this tenure.
  retired_through:
    is_a: tenure_closed_by
    slot_uri: heritageGraph:retiredThrough
    range: KumariRetirementEvent
    description: Retirement/desanctification event that ended this tenure.
    inverse: ended_tenure_of
  has_assertion:
    slot_uri: heritageGraph:hasAssertion
    range: Assertion
    multivalued: true
    description: Provenance-bearing assertion made about this entity or event.
    inverse: asserts_about
  asserts_about:
    slot_uri: heritageGraph:assertsAbout
    range: AssertionSubject
    required: true
    description: Heritage entity or event that is the subject of this assertion.
    inverse: has_assertion
  is_about:
    slot_uri: crm:P129_is_about
    range: AssertionSubject
    multivalued: true
    description: Heritage entity or event described by this information object.

  # ---- Guthi pattern (1.1.0): endowment, hereditary mandate, custody period ----
  endowment_holder:
    slot_uri: crm:P105_right_held_by
    range: Group
    description: "Guthi or state body (e.g. the Guthi Sansthan, holding nationalised guthi land) that holds the
      endowment."
  endowed_land:
    slot_uri: heritageGraph:endowedLand
    range: Place
    multivalued: true
    description: "Land (plots, fields) dedicated to the endowment."
  sustains:
    slot_uri: heritageGraph:sustains
    # base range for a sound OWL range; any_of refines it (as performed_by_group)
    range: AssertionSubject
    any_of:
      - range: ArchitecturalStructure
      - range: RitualEvent
      - range: Office
    multivalued: true
    # 1.1.0 (M13): an endowment sustains the office (which persists from holder
    # to holder), not one dated tenure of it
    description: "Structure, ritual or festival, or sacred office whose upkeep or performance the endowment funds."
  concerns_endowment:
    slot_uri: heritageGraph:concernsEndowment
    range: Endowment
    description: "Endowment founded, augmented, nationalised or alienated by this event."
  endowment_event_type:
    slot_uri: heritageGraph:endowmentEventType
    title: "has endowment event type"
    range: EndowmentEventType
    description: "Kind of endowment event (founding, augmentation, nationalisation, alienation)."
  endowment_donor:
    slot_uri: heritageGraph:endowmentDonor
    is_a: transferred_title_from
    range: Actor
    multivalued: true
    description: "Person or group who gave the property (the donor in a founding or augmentation)."
  endowment_recipient:
    slot_uri: heritageGraph:endowmentRecipient
    is_a: transferred_title_to
    range: Actor
    description: "Guthi or state body that received the property (e.g. the Guthi Sansthan in a nationalisation)."
  transferred_title_from:
    slot_uri: crm:P23_transferred_title_from
    range: Actor
    multivalued: true
    description: "Actor who gave up title (CRM P23)."
  transferred_title_to:
    slot_uri: crm:P22_transferred_title_to
    range: Actor
    multivalued: true
    description: "Actor who acquired title (CRM P22)."
  # ---- Tenure pattern (1.1.0, M13) ----
  tenure_holder:
    slot_uri: heritageGraph:tenureHolder
    range: Actor
    description: "Actor holding the office, duty or custody during the tenure."
  tenure_office:
    slot_uri: heritageGraph:tenureOffice
    range: Office
    description: "Office, role or duty held during the tenure."
  tenure_opened_by:
    slot_uri: heritageGraph:tenureOpenedBy
    range: TenureEvent
    multivalued: true
    description: "Event that opened the tenure (e.g. an enthronement, an appointment, a transfer of custody)."
  tenure_closed_by:
    slot_uri: heritageGraph:tenureClosedBy
    range: TenureEvent
    multivalued: true
    description: "Event that closed the tenure (e.g. a retirement, a death, a transfer of custody)."
  # ---- Access protocol (1.1.0, M11) ----
  access_rights:
    slot_uri: dcterms:accessRights
    description: "Access rights (DCMI). Not constrained by the SHACL shapes, so other vocabularies' IRI values (e.g.
      the EU access-right IRIs) validate. In the OWL, dcterms:accessRights is an object property (DCMI's range is
      dcterms:RightsStatement), so give an IRI, not a literal, to stay in OWL 2 DL. HeritageGraph's cultural
      protocols use access_protocol."
  access_protocol:
    slot_uri: heritageGraph:accessProtocol
    title: "has access protocol"
    is_a: access_rights
    range: AccessProtocol
    multivalued: true
    description: "Cultural access protocol for the thing or its record (e.g. restricted to initiates, secret or
      sacred, seasonal), set with the community concerned; a subproperty of dcterms:accessRights. Data under a
      restriction should not be published."

  role_holder:
    is_a: tenure_holder
    slot_uri: heritageGraph:roleHolder
    range: Actor
    any_of:
      - range: Person
      - range: CasteGroup
    description: "Person or caste group holding the hereditary duty during this tenure."
  role_duty:
    slot_uri: heritageGraph:roleDuty
    range: string
    description: "The ritual duty held (e.g. building the festival chariot, performing the daily worship)."
  duty_for:
    slot_uri: heritageGraph:dutyFor
    range: RitualEvent
    multivalued: true
    description: "Ritual or festival the hereditary duty serves."
  mandated_by:
    slot_uri: heritageGraph:mandatedBy
    range: Group
    description: "Guthi or state body that mandates (and usually funds) the hereditary duty."
  succession_rule:
    slot_uri: heritageGraph:successionRule
    range: string
    description: "Rule by which the duty passes on (e.g. eldest son of the lineage; within the caste group)."
  succeeds:
    slot_uri: heritageGraph:succeeds
    range: HereditaryRoleTenure
    # a tenure does not succeed itself, and two tenures do not succeed each other
    irreflexive: true
    asymmetric: true
    description: "Earlier tenure of the same hereditary office that this tenure succeeds."
  custody_holder:
    is_a: tenure_holder
    slot_uri: heritageGraph:custodyHolder
    range: Actor
    description: "Actor (typically a Guthi) holding custody during the period."
  custody_object:
    slot_uri: heritageGraph:custodyObject
    # base range for the OWL range: the union class (as sustains); a narrower
    # base would type every object in custody as a PhysicalHeritageThing
    range: AssertionSubject
    any_of:
      - range: PhysicalHeritageThing
      - range: HumanMadeObject
    description: "Structure or object in custody during the period (any heritage structure, element or
      human-made object, e.g. a museum object)."
  custody_opened_by:
    is_a: tenure_opened_by
    slot_uri: heritageGraph:custodyOpenedBy
    range: TransferOfCustody
    description: "Transfer of custody that began the period."
  custody_closed_by:
    is_a: tenure_closed_by
    slot_uri: heritageGraph:custodyClosedBy
    range: TransferOfCustody
    description: "Transfer of custody that ended the period."
