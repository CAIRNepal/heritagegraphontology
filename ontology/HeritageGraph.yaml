      - was_associated_with
      - used_method
      - used_equipment
      - generated
      - has_timespan
    broad_mappings:
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    annotations:
      disjoint_kind: event
      crm_superclass: crm:E7_Activity
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  InformationObject:
    is_a: DataSource
    # URI POLICY (alpha.5): narrower than the CRM class; IRI minted,
    # CRM identity moved to broad_mappings.
    class_uri: heritageGraph:InformationObject
    # its own label: "Information Object" is CIDOC-CRM's label for E73
    title: "Heritage information object"
    broad_mappings:
      - crm:E73_Information_Object
    description: "A recorded piece of information about heritage"
    slots:
      - name
      - is_about
      - was_generated_by
      - was_documented_by
      - source_language
  Verification:
    is_a: DocumentationActivity
    class_uri: heritageGraph:Verification
    description: "Process of cross-checking heritage claims against multiple sources"
    slots:
      - verification_method
      - note
      - verified_assertion
      - verified_by_expert
    broad_mappings:
      - prov:Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
  DataCustodian:
    class_uri: heritageGraph:DataCustodian
    description: "Institution or person currently responsible for stewarding heritage data."
    slots:
      - name
      - custodian_type
      - note
    is_a: Actor
    broad_mappings:
      - prov:Agent
  DestructionEvent:
    is_a: HistoricalEvent
    class_uri: crm:E6_Destruction
    description: "Event that destroyed a structure (CIDOC-CRM E6: the structure no longer exists in its former
      identity), linked to it by destroyed (crm:P13_destroyed). Damage a structure survives is not a destruction:
      record it as crmsci:S18_Alteration (natural, e.g. an earthquake) or crm:E11_Modification (human), and the
      resulting condition with a condition assessment."
    slots:
      - note
      - has_timespan
      - took_place_at
      - destroyed
    slot_usage:
      destroyed:
        # CIDOC-CRM P13 is necessary (1,n): a destruction destroys something
        required: true
        minimum_cardinality: 1
  SyncreticRelationship:
    # URI POLICY (alpha.5): narrower than the CRM class; IRI minted,
    # CRM identity moved to broad_mappings.
    class_uri: heritageGraph:SyncreticRelationship
    broad_mappings:
      - crm:E13_Attribute_Assignment
    description: "The act of identifying one deity with another across theological frameworks (a CIDOC-CRM
      E13 Attribute Assignment: P140 the deity identified, P141 the deity it is identified with), recorded
      with the source that reports it (documented_in_source)."
    slots:
      - name
      - note
      - assigned_to_deity
      - assigned_equivalent
      - syncretic_type
      - was_documented_by
      - documented_in_source
    # PROV PLACEMENT (1.1.0): the act (crm:E13 ⊑ E7, hence a prov:Activity),
    # not the claim. Its P140/P141 make every instance an E13 anyway, and as a
    # prov:Entity it was unsatisfiable under the common alignment
    # E7 ⊑ prov:Activity (prov:Entity and prov:Activity are disjoint). Sources
    # are given with documented_in_source (hg:mentionedInSource), not
    # prov:wasDerivedFrom, which applies to entities only.
    mixins:
      - Activity
    annotations:
      crm_superclass: crm:E13_Attribute_Assignment
      disjoint_kind: event
  GenericActivity:
    # 1.1.0 (M13): any CIDOC-CRM activity, so that a Tenure can be opened or
    # closed by an event HeritageGraph has no class for (an appointment, a
    # resignation). Abstract: it has no shape and adds nothing to crm:E7.
    abstract: true
    class_uri: crm:E7_Activity
    description: "Any CIDOC-CRM E7 Activity (e.g. an appointment or a resignation that opens or closes a tenure)."
  Death:
    # 1.1.0: a death (crm:E69, an E5 Event, not an E7 Activity) can close a
    # tenure. Abstract: no shape, nothing added to crm:E69.
    abstract: true
    class_uri: crm:E69_Death
    description: "A CIDOC-CRM E69 Death (e.g. the death that closes a holder's tenure)."
  TenureEvent:
    # 1.1.0 (M13): the events that open or close a tenure
    class_uri: heritageGraph:TenureEvent
    description: "An event that opens or closes a Tenure: a ritual (an enthronement, a retirement), a transfer of
      custody, an endowment event, a documentation or historical event, any other activity, or a death."
    union_of:
      - RitualEvent
      - HistoricalEvent
      - TransferOfCustody
      - EndowmentEvent
      - DocumentationActivity
      - GenericActivity
      - Death
  StructureType:
    # 1.1.0 (M14): one generic class instead of a class per local building type
    class_uri: heritageGraph:StructureType
    description: "A type of heritage structure from a controlled vocabulary or a community's own term list (a
      CIDOC-CRM E55 Type), e.g. the Newar bahah or bahi (Buddhist monastic courtyard), dyochhen (god-house), agam
      chhen (esoteric shrine house) or pitha (seat of a goddess). Link each term to AAT or Wikidata with SKOS
      mappings where an equivalent exists; local types need no new ontology class."
    slots:
      - name
      - note
    mixins:
      - Entity
    annotations:
      crm_superclass: crm:E55_Type
      disjoint_kind: concept
  Tenure:
    # 1.1.0 (M13): the pattern KumariTenure, HereditaryRoleTenure and
    # CustodyPeriod share, abstracted so it can be reused for offices and
    # custody elsewhere. Why not CIDOC-CRM E85 Joining / E86 Leaving: they
    # model membership of an E74 group; a Kumari's office, a hereditary ritual
    # duty and custody of a monument are not group memberships. Why not P14.1
    # "in the role of": it qualifies one activity, while a tenure is a period
    # with its own holder, office, opening and closing events and provenance.
    class_uri: heritageGraph:Tenure
    description: "A dated period during which an actor holds an office, a duty or custody of something (a CIDOC-CRM
      E4 Period), with the events that open and close it. KumariTenure, HereditaryRoleTenure and CustodyPeriod are
      specialisations; the pattern applies to offices and custody beyond Nepal."
    slots:
      - name
      - note
      - tenure_holder
      - tenure_office
      - has_timespan
      - tenure_opened_by
      - tenure_closed_by
      - has_assertion
    mixins:
      - Entity
    annotations:
      crm_superclass: crm:E4_Period
      disjoint_kind: period
  Office:
    # 1.1.0 (M13/M14): the office or role a tenure holds (a CIDOC-CRM E55
    # Type: the office is the type, the tenure the dated holding of it).
    class_uri: heritageGraph:Office
    description: "An office, role or duty that persons or groups hold for a period (a CIDOC-CRM E55 Type): the office
      is the type, a Tenure is the dated holding of it, the holder is the actor."
    slots:
      - name
      - note
    mixins:
      - Entity
    annotations:
      crm_superclass: crm:E55_Type
      disjoint_kind: concept
  RitualOffice:
    is_a: Office
    class_uri: heritageGraph:RitualOffice
    description: "A ritual office or specialist role (e.g. Vajracharya or Rajopadhyaya priest, Karmacharya, chariot
      builder, festival musician, the Kumari), held by a person or a caste group, often hereditarily."
  StateHeritageAuthority:
    # 1.1.0 (M12): a state body, so that the Guthi Sansthan, a public
    # corporation, need not be typed as a Guthi. A CIDOC-CRM E74 Group (via
    # Group): CRM 7 merged E40 Legal Body into E74.
    is_a: Group
    class_uri: heritageGraph:StateHeritageAuthority
    description: "A state body with responsibility for heritage (a CIDOC-CRM E74 Group), e.g. the Guthi Sansthan
      (Guthi Corporation, a public corporation that administers nationalised guthi land) or the Department of
      Archaeology."
    annotations:
      disjoint_kind: group
  KumariTenure:
    # 1.1.0: a specialisation of the generic Tenure pattern
    is_a: Tenure
    # ALIASES (alpha.5): romanized alternate term.
    aliases:
      - "Living Goddess Tenure"
    class_uri: heritageGraph:KumariTenure
    # MAPPING (alpha.5): the documentation describes the tenure as an E4
    # Period; grounded here as a broad mapping (KumariTenure is narrower).
    broad_mappings:
      - crm:E4_Period
    description: "Time-bounded role where a person embodies a deity as Living Goddess (Kumari), residing at a specific
      god-house and supported by religious institutions. This class captures the unique Nepali tradition of living
      deity embodiment in young girls selected from Buddhist Shakya/Vajracharya families."
    slots:
      - name
      - tenure_holder
      - had_participant
      - embodied_deity
      - residence_structure
      - has_timespan
      - supported_by_institution
      - was_documented_by
      - assumes_role
      - selected_through
      - enthroned_through
      - retired_through
    slot_usage:
      name:
        required: true
        description: "Name of this tenure period (e.g. 'Royal Kumari tenure, 2017-2025'). Kumari are children:
          prefer the office and period to the person's name unless the name is public and its use is appropriate."
      tenure_holder:
        required: true
        range: Person
        description: "The girl serving as Living Goddess during this period"
      had_participant:
        description: "Other actors taking part in the tenure without holding it (1.0.x data gave the holder here;
          use tenure_holder)"
      embodied_deity:
        required: true
        range: Deity
        description: "Deity believed to be present in this person (e.g., Taleju, Kumari Devi)"
      residence_structure:
        required: true
        range: ArchitecturalStructure
        description: "God-house where Living Goddess resides (e.g., Kumari Ghar)"
      has_timespan:
        required: true
        range: TimeSpan
        description: "Duration of Living Goddess tenure (from selection to retirement)"
      supported_by_institution:
        range: Group
        multivalued: true
        description: "Guthi or state body (e.g. the Guthi Sansthan) providing economic or ritual support during the
          tenure"



    annotations:
      design_note: 'PROV placement: a prov:Entity, i.e. a thing whose provenance is tracked (sources, attributions,
        assertions about it), and a crm:E4_Period (stated, 1.1.0). A period is not a crm:E7_Activity, so the class
        stays outside any E7 ⊑ prov:Activity alignment and the PROV-O Entity/Activity disjointness is not engaged;
        reasoning with CIDOC-CRM, CRMinf, CRMsci and PROV-O loaded is consistent with the example data.'
  KumariLifecycleEvent:
    is_a: RitualEvent
    abstract: true
    class_uri: heritageGraph:KumariLifecycleEvent
    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    description: 'Abstract event that bounds a KumariTenure (selection, enthronement, or retirement). Each
      concrete subclass requires exactly one tenure edge via slot_usage: initiated_tenure (selection),
      ended_tenure_of (retirement), or bounds_tenure itself (enthronement).'
    slots:
      - bounds_tenure
  KumariSelectionEvent:
    is_a: KumariLifecycleEvent
    class_uri: heritageGraph:KumariSelectionEvent
    description: "Tantric ritual process of selecting a new Living Goddess from eligible candidates. Involves examination
      of 32 auspicious physical marks (lakshana) and horoscope matching with the city and ruling authority, carried
      out, in published accounts, by the priests of Taleju and the Buddhist Vajracharya priests with an astrologer.
      Accounts of a
      fearlessness test are disputed and are recorded as such with FearlessnessAssessment, not stated here."


    

    slots:
      - name
      - selected_person
      - initiated_tenure
      - has_timespan
      - carried_out_by
      - performed_by_group
      - took_place_at
      # DL FIX (alpha.6): deprecated selection_criteria_met detached from this
      # class so no live axiom references a deprecated property (ROBOT report
      # deprecated_property_reference ERROR). The slot itself stays declared
      # (and owl:deprecated) for backward compatibility.
      - has_assertion
      - was_documented_by
      - is_critical_for_festival
      - has_criterion
      - confers_role
    slot_usage:
      name:
        required: true
        description: "Name of selection event"
      selected_person:
        required: true
        range: Person
        description: "Girl selected to become Living Goddess"
      initiated_tenure:
        required: true
        range: KumariTenure
        description: "Living Goddess tenure that this selection event led to (the tenure itself opens at the
          enthronement, enthroned_through)"

  
    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
  Technique:
    class_uri: crm:E29_Design_or_Procedure
    description: "Method or craft process used in production or ritual"
    slots:
      - name
      - note
    mixins:
      - Entity
  Material:
    class_uri: crm:E57_Material
    description: "Physical substance used in construction or crafting"
    slots:
      - name
      - note
    mixins:
      - Entity
  # GUTHI PATTERN (1.1.0): endowment and hereditary mandate, the two things a
  # Guthi has that plain CIDOC-CRM groups (E74) and legal bodies (E40) do not
  # capture; CustodyPeriod gives custody the same dated period pattern as
  # KumariTenure, so "who held this structure when X happened" is answered
  # from one node instead of being reconstructed from transfer-event chains.
  Endowment:
    class_uri: heritageGraph:Endowment
    description: "Land, income or other property permanently dedicated to sustain a structure, a ritual or festival,
      or a sacred office, and held by a Guthi. The endowment, not the membership, is what makes a Guthi a trust."
    broad_mappings:
      - crm:E72_Legal_Object
    slots:
      - name
      - note
      - endowment_holder
      - endowed_land
      - sustains
      - has_assertion
    slot_usage:
      name:
        required: true
      endowment_holder:
        required: true
      sustains:
        required: true
    mixins:
      - Entity
    annotations:
      crm_superclass: crm:E72_Legal_Object

  EndowmentEvent:
    class_uri: heritageGraph:EndowmentEvent
    description: "Event that founds, augments, nationalises or alienates a Guthi endowment, with its donor or
      recipient and its date."
    # Every endowment event (founding, augmentation, nationalisation,
    # alienation) transfers title to land or other property, so each is a
    # CRM E8 Acquisition; donor and recipient are P23 / P22.
    broad_mappings:
      - crm:E8_Acquisition
    slots:
      - name
      - note
      - concerns_endowment
      - endowment_event_type
      - endowment_donor
      - endowment_recipient
      - has_timespan
      - took_place_at
      - has_assertion
    slot_usage:
      concerns_endowment:
        required: true
      endowment_event_type:
        required: true
      has_timespan:
        required: true
    mixins:
      - Activity
    annotations:
      disjoint_kind: event
      crm_superclass: crm:E8_Acquisition

  HereditaryRoleTenure:
    # 1.1.0: a specialisation of the generic Tenure pattern
    is_a: Tenure
    aliases:
      - "Hereditary ritual office"
    class_uri: heritageGraph:HereditaryRoleTenure
    description: "Time-bounded holding of a hereditary ritual duty by a person or caste group, under the mandate of
      a Guthi, with the rule by which the duty passes on. The same period pattern as KumariTenure, applied to
      hereditary offices (priests, chariot builders, musicians)."
    broad_mappings:
      - crm:E4_Period
    slots:
      - name
      - note
      - role_holder
      - role_duty
      - duty_for
      - mandated_by
      - succession_rule
      - succeeds
      - tenure_office
      - tenure_opened_by
      - tenure_closed_by
      - has_timespan
      - has_assertion
    slot_usage:
      tenure_office:
        range: RitualOffice
        description: "The hereditary ritual office held (e.g. chariot builder, Rajopadhyaya priest)"
      role_holder:
        required: true
      role_duty:
        required: true
    annotations:
      design_note: 'PROV placement: a prov:Entity, i.e. a thing whose provenance is tracked (sources, attributions,
        assertions about it), and a crm:E4_Period (stated, 1.1.0). A period is not a crm:E7_Activity, so the class
        stays outside any E7 ⊑ prov:Activity alignment and the PROV-O Entity/Activity disjointness is not engaged;
        reasoning with CIDOC-CRM, CRMinf, CRMsci and PROV-O loaded is consistent with the example data.'

  CustodyPeriod:
    # 1.1.0: a specialisation of the generic Tenure pattern
    is_a: Tenure
    class_uri: heritageGraph:CustodyPeriod
    description: "Dated period during which an actor (typically a Guthi) holds custody of a heritage structure or
      object, opened and closed by transfer-of-custody events. Unlike the untimed crm:P50i_is_current_keeper_of,
      it answers who held custody at a given date."
    broad_mappings:
      - crm:E4_Period
    slots:
      - name
      - note
      - custody_holder
      - custody_object
      - has_timespan
      - custody_opened_by
      - custody_closed_by
      - has_assertion
    slot_usage:
      custody_holder:
        required: true
      custody_object:
        required: true
      has_timespan:
        required: true
    annotations:
      design_note: 'PROV placement: a prov:Entity, i.e. a thing whose provenance is tracked (sources, attributions,
        assertions about it), and a crm:E4_Period (stated, 1.1.0). A period is not a crm:E7_Activity, so the class
        stays outside any E7 ⊑ prov:Activity alignment and the PROV-O Entity/Activity disjointness is not engaged;
        reasoning with CIDOC-CRM, CRMinf, CRMsci and PROV-O loaded is consistent with the example data.'
  # Container and Metadata (the LinkML tree_root and its dataset header) moved
  # to HeritageGraph-container.yaml in 1.1.0: they exist only so JSON/YAML data
  # files can hold instances, carry no domain semantics, and are generated only
  # into the JSON Schema. Their published OWL IRIs remain as owl:deprecated stubs.
# ============================================================================
# SLOTS (PROPERTIES)
# ============================================================================

  KumariRetirementEvent:
    is_a: KumariLifecycleEvent
    class_uri: heritageGraph:KumariRetirementEvent
    description: 'Ritual or administrative event that formally ends a Living Goddess tenure according to tradition,
      returning the person to secular life. Record the event and its date, not the reason: the traditional grounds
      concern the bodily state of a child, and HeritageGraph does not record health or bodily data about persons.'
    slots:
      - name
      - ended_tenure_of
      - has_timespan
      - note
      - carried_out_by
      - performed_by_group
      - took_place_at
      - has_assertion
      - was_documented_by
    slot_usage:
      name:
        required: true
        description: "Name of retirement event"

      
      ended_tenure_of:
        required: true
        range: KumariTenure
        description: "The Living Goddess tenure that this event terminated"
      has_timespan:
        required: true
        range: TimeSpan
        description: "When the retirement occurred"

      
      carried_out_by:
        # RANGE FIX (v1.0.1): was Person. performed_by_group is a subproperty of
        # carried_out_by (crm:P14), so a Person-only range made any Guthi or caste
        # group performing a retirement a crm:E21_Person.
        range: Actor
        multivalued: true
        description: "Priests, officials, or groups who performed the retirement ritual"
      took_place_at:
        range: Place
        description: "Where the retirement ceremony occurred"

    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
  KumariRole:
    # ALIASES (alpha.5): English/romanized altLabels per reviewer request.
    # Script-specific (Nepali/Newar) labels are deferred to a localization
    # layer; the ontology itself stays language-generic.
    aliases:
      - "Living Goddess"
      - "Royal Kumari"
    is_a: RitualOffice
    class_uri: heritageGraph:KumariRole
    broad_mappings:
      # URI POLICY (alpha.5): narrower than crm:E55_Type; moved from exact_mappings.
      - crm:E55_Type
    description: The role/office of Kumari (living-goddess embodiment) that a person assumes for the duration 
      of a KumariTenure. The role is the type; the tenure is the time-bounded holding of it; the person is the
      holder.
    slots:
      - role_deity
  KumariHouse:
    # ALIASES (alpha.5): romanized alternate term.
    aliases:
      - "Kumari Ghar"
    is_a: ReligiousStructure
    class_uri: heritageGraph:KumariHouse
    # MAPPING AUDIT (alpha.5): wikidata:Q2708161 is a spider species
    # (verified) -- wrong entity, and no class-level Wikidata concept for
    # 'Kumari house' was found -> removed.
    description: God-house residence of a Kumari during tenure (e.g., Kumari Ghar, Kathmandu). Specialised 
      ReligiousStructure.
  KumariEnthronementEvent:
    is_a: KumariLifecycleEvent
    class_uri: heritageGraph:KumariEnthronementEvent
    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    description: Ritual installing a selected girl into the Kumari role and residence, activating the tenure 
      (distinct from selection, which chooses her, and retirement, which ends it).
    slots:
      - name
      - bounds_tenure
      - enthroned_person
      - confers_role
      - has_timespan
      - carried_out_by
      - took_place_at
      - has_assertion
      - was_documented_by
    slot_usage:
      bounds_tenure:
        required: true
        description: The tenure this enthronement activates (required tenure edge for this event type).
      enthroned_person:
        range: Person
        required: true
        slot_uri: heritageGraph:enthronedPerson
        description: Girl enthroned as Kumari.
      confers_role:
        range: KumariRole
        required: true
        slot_uri: heritageGraph:confersRole
        description: KumariRole conferred by this enthronement.
  SelectionCriterion:
    class_uri: heritageGraph:SelectionCriterion
    broad_mappings:
      # URI POLICY (alpha.5): narrower than crm:E55_Type; moved from exact_mappings.
      - crm:E55_Type
    description: "An eligibility criterion a candidate must satisfy to assume the Kumari role. Modelled as
      explicit subclasses so 'what are the eligibility criteria?' is a subclass query, not free text.
      Ethics: candidates are children. Criteria describe the tradition; data about how a named or identifiable
      child met them (bodily marks, health, horoscope) must not be recorded."
    mixins:
      - Entity
    annotations:
      disjoint_kind: concept
      crm_superclass: crm:E55_Type
  AgeCriterion:
    is_a: SelectionCriterion
    class_uri: heritageGraph:AgeCriterion
    description: Candidate must be within the prescribed pre-pubescent age range.
  LineageCriterion:
    is_a: SelectionCriterion
    class_uri: heritageGraph:LineageCriterion
    description: Candidate must belong to an eligible lineage (Shakya / Vajracharya Newar Buddhist family).
  ThirtyTwoPerfectionsCriterion:
    # ALIASES (alpha.5): romanized alternate term.
    aliases:
      - "Battis Lakshana"
    is_a: SelectionCriterion
    class_uri: heritageGraph:ThirtyTwoPerfectionsCriterion
    description: The battis lakshana, the traditional list of thirty-two auspicious marks a candidate is held to
      bear. HeritageGraph records that the criterion belongs to the selection, not any assessment of a candidate.
  HoroscopeCompatibilityCriterion:
    is_a: SelectionCriterion
    class_uri: heritageGraph:HoroscopeCompatibilityCriterion
    description: Candidate's horoscope must be compatible with the city and ruling authority.
  PhysicalIntegrityCriterion:
    is_a: SelectionCriterion
    class_uri: heritageGraph:PhysicalIntegrityCriterion
    description: The traditional requirement of physical integrity in a candidate. HeritageGraph records that the
      criterion belongs to the selection, not any assessment of a candidate's body or health.
  RitualAssessment:
    is_a: RitualEvent
    abstract: true
    class_uri: heritageGraph:RitualAssessment
    broad_mappings:
      - prov:Activity
      # URI POLICY (alpha.5): narrower than E7; moved from exact_mappings.
      - crm:E7_Activity
    description: A performed assessment carried out during Kumari selection. Modelled as an event (not a hard 
      criterion) so that source-specific, possibly conflicting accounts of whether/how it was conducted attach
      as provenanced Assertions rather than being asserted as fact.
    slots:
      - assesses_candidate
      - part_of_selection
      - has_assertion
      - was_documented_by
      - carried_out_by
      - has_timespan
  FearlessnessAssessment:
    is_a: RitualAssessment
    class_uri: heritageGraph:FearlessnessAssessment
    description: The 'fearlessness test' popularly described (animal heads, masked dancers in darkness). Its 
      historical and contemporary practice is DISPUTED -- some former Kumaris contest how it is described. 
      Represented as an assessment whose accounts are source-attributed via has_assertion, NOT as a mandatory 
      criterion.
    annotations:
      skos:scopeNote: 'Deliberately not a SelectionCriterion subclass: popular accounts and lived testimony disagree.
        Attach each account as a Assertion (CRMinf I2 Belief) with its own source and confidence.'
slots:
  architectural_structures:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of occurred_in_presence_of.
    slot_uri: heritageGraph:architecturalStructures
    is_a: occurred_in_presence_of
    range: ArchitecturalStructure
    multivalued: true
    description: "Heritage structures affected by or present during this historical event"



  id:
    identifier: true
    range: uriorcurie
    required: true
    description: "Globally unique URI identifier"
    slot_uri: dcterms:identifier
    exact_mappings:
      - schema:identifier

  route_places:
    # PREDICATE FIX (alpha.5): previously reused crm:P7_took_place_at, making a
    # procession route indistinguishable from an event venue. Minted subproperty
    # of took_place_at (rdfs:subPropertyOf crm:P7 via is_a).
    slot_uri: heritageGraph:routePlaces
    # 1.1.0: no longer a subproperty of crm:P7 took place at. P7 gives a place
    # that approximates the whole event's extent; a place on the route is only
    # part of it.
    related_mappings:
      - crm:P7_took_place_at
    range: Place
    multivalued: true

    description: "Ordered list of places visited during movement ritual"

  start_place:
    slot_uri: heritageGraph:startPlace
    range: Place
    # not a subproperty of crm:P27 moved from: its domain E9 Move would make
    # every ritual with a start place a Move
    related_mappings:
      - crm:P27_moved_from
    description: "Starting location of movement ritual"

  end_place:
    slot_uri: heritageGraph:endPlace
    range: Place
    related_mappings:
      - crm:P26_moved_to
    description: "Ending location of movement ritual"

  route_description:
    slot_uri: heritageGraph:routeDescription
    range: string
    description: "Text description of the procession route"

  name:
    slot_uri: rdfs:label
    range: string
    description: "Primary name or label"

  is_component_of:
    slot_uri: crm:P46i_forms_part_of
    range: ArchitecturalStructure
    description: "Larger structure that this element is part of"


  note:
    slot_uri: crm:P3_has_note
    range: string
    multivalued: true
    description: "Free-text note (description, reason, verification notes)"

    # ============================================================================
  # LIVING GODDESS (KUMARI) SLOTS
  # ============================================================================

  had_participant:
    # CRM D/R FIX (alpha.5): P11_had_participant has domain E5 Event, but this
    # slot's owner (KumariTenure) is a period, not an event; CRM defines no
    # participation property for E4 Period. Minted.
    slot_uri: heritageGraph:hadParticipant
    range: Actor
    multivalued: true
    # close, not sub-property or exact: P11's domain is E5 Event, and this slot
    # is also used on periods (KumariTenure); and it excludes the actor who
    # carries the event out, whom P11 includes (P14 is a subproperty of P11)
    close_mappings:
      - crm:P11_had_participant
    description: "Actor(s) participating in this period, situation or ritual without carrying it out (e.g. the Kumari
      in a chariot procession). The holder of a tenure is given with tenure_holder."

  embodied_deity:
    # CRM D/R FIX (alpha.5): P14.1_in_the_role_of is not a first-class property
    # -- in CRM RDF it exists only on the reified PC14_carried_out_by node and
    # its range is E55 Type. No CRM property links a tenure directly to an
    # embodied deity; minted. (A qualified-role pattern via PC14 or
    # prov:qualifiedAssociation is the candidate future refactor.)
    slot_uri: heritageGraph:embodiedDeity
    range: Deity
    description: "Deity role embodied by participant"

  residence_structure:
    # CRM D/R FIX (alpha.5): P74's range is E53 Place; CRM strictly separates
    # physical things from places, so targeting a structure (E22) violated the
    # range. Minted; alternatively assert P74 to the structure's Place.
    slot_uri: heritageGraph:residenceStructure
    range: ArchitecturalStructure
    description: "Structure where a person resides during a specific period. For Living Goddess, this is typically
      a Kumari Ghar (god-house)."


  supported_by_institution:
    slot_uri: heritageGraph:supportedByInstitution
    range: Group
    multivalued: true
    description: "Institution(s) providing economic support (stipend, land endowment) or ritual support (priest
      salaries) for a Living Goddess during tenure. Extends Guthi role beyond structure management to person support."



  ended_tenure_of:
    slot_uri: heritageGraph:endedTenureOf
    # KUMARI WIRING (alpha.5): now a specialization of bounds_tenure (one
    # canonical event->tenure edge family) and the declared inverse of
    # retired_through.
    is_a: bounds_tenure
    range: KumariTenure
    description: "Points from a KumariRetirementEvent to the tenure that it terminated. Enables reconstruction
      of the complete Kumari lifecycle."
    inverse: retired_through

  # KUMARI WIRING (alpha.5): has_retirement_event deleted -- it duplicated
  # retired_through as a second tenure->retirement edge, and its IRI still
  # carried the pre-rename name hasTenureEndEvent. retired_through is now the
  # declared inverse of ended_tenure_of.

  selected_person:
    slot_uri: heritageGraph:selectedPerson
    range: Person
    description: "Person selected through a ritual selection process to assume a sacred role or office"

  initiated_tenure:
    slot_uri: heritageGraph:initiatedTenure
    # KUMARI WIRING (alpha.5): specialization of bounds_tenure; declared
    # inverse of selected_through.
    is_a: bounds_tenure
    range: KumariTenure
    description: "Kumari tenure that was initiated by this selection event"
    inverse: selected_through

  selection_criteria_met:
    slot_uri: heritageGraph:selectionCriteriaMet
    range: string
    multivalued: true
    description: "DEPRECATED free-text list; use has_criterion -> SelectionCriterion subclasses instead. Retained
      for backward compatibility."

    # CONSTRAINT FIX (alpha.5): machine-readable LinkML deprecated metaslot
    # instead of a free-text annotation that generators ignore.
    deprecated: "Deprecated free-text criteria list; use has_criterion -> SelectionCriterion subclasses."
    deprecated_element_has_possible_replacement: has_criterion
  has_timespan:
    slot_uri: crm:P4_has_time-span
    range: TimeSpan
    description: "Links event to its temporal extent"



  date_earliest:
    slot_uri: crm:P82a_begin_of_the_begin
    range: datetime
    description: "Earliest possible date, always in the proleptic Gregorian calendar (xsd:dateTime); for a date
      recorded in another calendar, the start of its converted Gregorian interval (see recorded_date)."

  date_latest:
    slot_uri: crm:P82b_end_of_the_end
    range: datetime
    description: "Latest possible date, always in the proleptic Gregorian calendar (xsd:dateTime); for a date
      recorded in another calendar, the end of its converted Gregorian interval (see recorded_date)."

  recorded_date:
    slot_uri: heritageGraph:recordedDate
    range: string
    broad_mappings:
      - crm:P3_has_note
    # CRM gives a date as written as an E41 Appellation of the time-span
    # (P1 is identified by); this is its literal shortcut
    related_mappings:
      - crm:P1_is_identified_by
    description: "The date as written in the source, in the calendar given by calendar_system (e.g. '2072' for a
      Bikram Sambat year, 'NS 1135 Kaulaathwa', 'VS 2021'). It is never put into an xsd:dateTime: the converted
      Gregorian bounds go in date_earliest / date_latest."

  falls_within:
    slot_uri: crm:P86_falls_within
    range: TimeSpan
    multivalued: true
    description: "A time-span that contains this one: e.g. the exact time-span of an occurrence falls within the
      converted interval of each calendar record of it (a Bikram Sambat or Nepal Sambat year)."

  calendar_system:
    title: "has calendar system"
    slot_uri: heritageGraph:calendarSystem
    range: CalendarSystem
    description: "Calendar system used for date representation"

  lunar_date_tithi:
    slot_uri: heritageGraph:lunarDateTithi
    range: string
    description: "Lunar day (tithi) by which the practice is timed, in free text (e.g. 'Bhadra Shukla
      Chaturdashi')."

  recurrence_pattern:
    slot_uri: heritageGraph:recurrencePattern
    range: string
    description: "How the practice this occurrence belongs to recurs (e.g. annual, monthly), in free text. It
      describes the practice, not the occurrence: each occurrence is its own RitualEvent with its own time-span."

  birth_timespan:
    # 1.1.0: no longer rdfs:subPropertyOf crm:P4_has_time-span. P4 belongs to
    # temporal entities (E2), and a person is a persistent item (E77, disjoint
    # from E2): the subproperty typed every person with a birth date as both,
    # and gave a person with birth and death two P4 values where CRM allows one.
    # It is a shortcut for the CRM path person -P98i-> E67 Birth -P4-> E52,
    # stated as an OWL property chain, so data written the CRM way also
    # answers queries on birthTimespan.
    slot_uri: heritageGraph:birthTimespan
    range: TimeSpan
    description: "Person's birth timespan (shortcut for crm:P98i_was_born / crm:P4_has_time-span)"
    annotations:
      owl_property_chain: crm:P98i_was_born crm:P4_has_time-span

  death_timespan:
    # 1.1.0: see birth_timespan (CRM path person -P100i-> E69 Death -P4-> E52).
    slot_uri: heritageGraph:deathTimespan
    range: TimeSpan
    description: "Person's death timespan (shortcut for crm:P100i_died_in / crm:P4_has_time-span)"
    annotations:
      owl_property_chain: crm:P100i_died_in crm:P4_has_time-span

  publication_timespan:
    # 1.1.0: no longer rdfs:subPropertyOf crm:P4_has_time-span: a source is an
    # information object (E73, a persistent item), and P4 belongs to temporal
    # entities (E2, disjoint from E77). CRM has no publication event class, so
    # no property chain is stated; the time-span is that of the publication.
    slot_uri: heritageGraph:publicationTimespan
    range: TimeSpan
    description: "When source was published"

  # --- SPATIAL PROPERTIES ---


  place_coordinates:
    # GeoSPARQL's geo:asWKT has domain geo:Geometry, so it cannot sit on a
    # place (E53) directly. CIDOC-CRM 7.1.3 gives P168 place is defined by,
    # whose range is rdfs:Literal, for exactly this: a place defined by a
    # geometry literal (here a GeoSPARQL WKT literal).
    slot_uri: crm:P168_place_is_defined_by
    range: wktLiteral
    description: "The place's geometry, as a GeoSPARQL WKT literal (crm:P168 place is defined by)"
    related_mappings:
      - geo:asWKT

  place_type:
    # DL FIX (alpha.6): dropped is_a has_type. A string-valued slot cannot
    # specialize crm:P2_has_type (an object property ranging over E55 Type):
    # the generated SubObjectPropertyOf over a datatype property is an
    # OWL Full pun. Free-text typing stays; CRM alignment would require an
    # E55-backed vocabulary first.
    slot_uri: heritageGraph:placeType
    range: string
    description: "Type of place (city, village, region), free text"

  has_current_location:
    slot_uri: crm:P55_has_current_location
    range: Place
    description: "Current location of object or structure"

  took_place_at:
    slot_uri: crm:P7_took_place_at
    range: Place
    description: "Place where the event occurred"

  ritual_on_structure:
    slot_uri: crm:P8_took_place_on_or_within
    range: PhysicalHeritageThing
    description: "Ritual occurs at specific temple or monument"



  contains_structure:
    slot_uri: crm:P53i_is_former_or_current_location_of
    range: ArchitecturalStructure
    multivalued: true
    description: "Structures located in this place"

  # --- EVENT-CENTRIC PRODUCTION RELATIONSHIPS ---
  is_primary_for_tradition:
    slot_uri: heritageGraph:isPrimaryForTradition
    range: ReligiousTradition
    multivalued: true
    description: "Religious tradition(s) that use this calendar system for their rites. Calendars are not
      divided by religion in Nepal: Nepal Sambat is the era of the Newar ritual calendar, used by Newar Hindus and
      Buddhists alike, and Bikram Sambat is the official civil era"

  existence_status:
    title: "has existence status"
    slot_uri: heritageGraph:existenceStatus
    range: ExistenceStatus
    description: "Current physical status of the structure"

  last_known_existence_date:
    slot_uri: heritageGraph:lastKnownExistenceDate
    range: datetime
    description: "Latest date when this structure is documented as existing (ISO 8601)"

  destruction_event:
    title: "has destruction event"
    slot_uri: heritageGraph:destructionEvent
    range: DestructionEvent
    # 1.1.0: the inverse of crm:P13_destroyed (the LUX module already stated
    # destructionEvent ≡ crm:P13i_was_destroyed_by; the core now agrees)
    inverse: destroyed
    description: "Event that destroyed this structure (if known)"

  destroyed:
    slot_uri: crm:P13_destroyed
    range: PhysicalHeritageThing
    multivalued: true
    inverse: destruction_event
    description: "Structure or object this destruction ended (CIDOC-CRM P13)"

  motivated_by:
    slot_uri: crm:P17_was_motivated_by
    range: HistoricalEvent
    multivalued: true
    description: "Event that prompted this ritual, e.g. an earthquake prompting a propitiation (CIDOC-CRM P17).
      A crisis ritual is motivated by the crisis, not part of it (not crm:P9)."

  hypothesized_location:
    slot_uri: heritageGraph:hypothesizedLocation
    range: Place
    multivalued: true
    description: "Possible locations if the structure is lost"

  documented_in_source:
    slot_uri: heritageGraph:mentionedInSource
    range: DataSource
    multivalued: true
    description: "Source(s) that mention/document this entity: the normative way to cite a source for a description
      of a heritage thing, event, actor or relationship. Distinct from was_derived_from, which
      is used only on assertions (I2 Belief) with was_attributed_to for the claimant. A source's own bibliographic
      data uses source_citation, datacite_creator, source_url and datacite_identifier. Entity-mention is not logical
      derivation."



    annotations:
      prov_alignment: prov:wasInfluencedBy
  was_produced_by_event:
    slot_uri: crm:P108i_was_produced_by
    range: Production
    description: "Event that created this object or structure"

  produced_object:
    slot_uri: crm:P108_has_produced
    range: PhysicalHeritageThing
    description: "Object produced by this production event"


  carried_out_by:
    slot_uri: crm:P14_carried_out_by
    range: Actor
    multivalued: true
    description: "Actor(s) who performed this event"
  used_by:
    slot_uri: heritageGraph:usedBy
    range: Actor
    multivalued: true
    description: "Actor(s) who use, handle, or are responsible for this object in ritual contexts"

  commissioned_by:
    # CRM D/R FIX (alpha.5): P17_was_motivated_by points to the motivating
    # thing, not the commissioning agent -- semantically wrong here. CRM's
    # idiom is a role-qualified P14 (PC14), a larger refactor; minted direct
    # property in the interim.
    slot_uri: heritageGraph:commissionedBy
    range: Actor
    multivalued: true
    description: "Person or group who commissioned production"


  used_technique:
    # CRM D/R FIX (alpha.5): P32_used_general_technique has range E55 Type, but
    # this slot's range is Technique (= E29 Design or Procedure). The official
    # property with range E29 is P33_used_specific_technique (P32/P33 were
    # swapped).
    slot_uri: crm:P33_used_specific_technique
    range: Technique
    multivalued: true
    description: "Craft technique used in production"

  # --- RITUAL EVENT RELATIONSHIPS ---

  occurred_in_presence_of:
    slot_uri: crm:P12_occurred_in_the_presence_of
    range: Entity
    multivalued: true
    description: "Generic CRM presence relation (P12): entity present at an event. Canonical holder of
      the CRM predicate; use the specific presence slots in data."

  invokes_deity:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of the canonical
    # crm:P12 holder occurred_in_presence_of.
    slot_uri: heritageGraph:invokesDeity
    is_a: occurred_in_presence_of
    range: Deity
    inverse: is_invoked_in_ritual
    multivalued: true
    description: "Deity invoked or made present through ritual"

  occurs_before:
    # CRM 7.x FIX: strict precedence is P183 in CIDOC-CRM 7.x; the pre-7.x
    # "occurs before" property is deprecated and absent from the v7.1.3 RDFS.
    slot_uri: crm:P183_ends_before_the_start_of
    range: RitualEvent
    description: "A ritual that follows this one in the canonical sequence (strict precedence, CRM P183; not
      necessarily the immediately next one)."

  occurs_after:
    # CRM 7.x FIX: inverse of P183_ends_before_the_start_of (CIDOC-CRM v7.1.3).
    slot_uri: crm:P183i_starts_after_the_end_of
    range: RitualEvent
    description: "Points to the prerequisite ritual."



  performed_by_group:
    is_a: carried_out_by
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty; carried_out_by
    # keeps crm:P14 as the canonical holder.
    slot_uri: heritageGraph:performedByGroup
    # DL FIX (alpha.5): without a base range, gen-owl defaulted this slot to a
    # datatype property, illegally punning crm:P14 as both ObjectProperty and
    # DatatypeProperty (flagged by Protege/HermiT). Actor is the sound base
    # range (Guthi and CasteGroup are both Actors); any_of refines it.
    range: Actor
    any_of:
      - range: Guthi
      - range: CasteGroup
    multivalued: true
    description: "Group (Guthi, caste) responsible for ritual"

  is_critical_for_festival:
    slot_uri: heritageGraph:isCriticalForFestival
    range: boolean
    description: "Whether this ritual is essential for the festival's completion"


  is_part_of_festival:
    slot_uri: crm:P9i_forms_part_of
    range: Festival
    description: "Larger festival this ritual is part of"

  has_religious_tradition:
    slot_uri: heritageGraph:hasReligiousTradition
    is_a: has_type
    range: ReligiousTradition
    multivalued: true
    description: "Religious tradition(s) within which this deity is venerated, or which use this structure (a temple,
      or a pavilion, rest house or water spout with a shrine)"

  includes_ritual_event:
    slot_uri: crm:P9_consists_of
    range: RitualEvent
    multivalued: true
    description: "Component rituals of festival"

  # PREDICATE FIX (alpha.5-final): eight semantically distinct typing slots
  # shared bare crm:P2_has_type; SHACL validation of the demonstrator proved
  # this collides inside single nodes (a Temple's style, and its religious
  # traditions, became indistinguishable P2 triples violating each other's
  # value constraints). Same repair pattern as P4/P7/P14i: one canonical P2
  # holder (has_type), minted subproperties for each typing axis.
  has_type:
    slot_uri: crm:P2_has_type
    description: "Generic CRM typing property (P2 has type). Canonical holder of the CRM predicate;
      use the specific typing slots below in data."

  structure_type:
    title: "has structure type"
    slot_uri: heritageGraph:structureType
    is_a: has_type
    range: StructureType
    multivalued: true
    description: "Type of the structure from a controlled vocabulary or a local term list (e.g. bahah, dyochhen),
      finer than its class; a subproperty of crm:P2_has_type."

  ritual_type:
    title: "has ritual type"
    slot_uri: heritageGraph:ritualType
    is_a: has_type
    range: RitualType
    description: "Classification of ritual (puja, jatra, consecration)"

  # --- DEITY-STRUCTURE RELATIONSHIPS (EVENT-MEDIATED) ---
  assigned_to_deity:
    slot_uri: crm:P140_assigned_attribute_to
    description: "The deity instance that is the subject of the syncretic claim."
    range: Deity
    required: true


  assigned_equivalent:
    slot_uri: crm:P141_assigned
    description: "The deity or sacred figure being identified as equivalent to the primary deity."
    range: Deity
    required: true
    multivalued: true

  syncretic_type:
    title: "has syncretic type"
    slot_uri: heritageGraph:syncreticType
    is_a: has_type
    description: "The typological nature of the syncretism (e.g., Ontological Identity, Functional Overlap, Iconographic
      Similarity)."
    range: SyncreticType
    recommended: true



  enshrines_deity_through_event:
    slot_uri: heritageGraph:enshrinesDeityThroughEvent
    range: Enshrinement
    multivalued: true
    description: "Enshrinement event that installed deity in temple"
    inverse: enshrined_in_structure

  used_materials:
    slot_uri: crm:P125_used_object_of_type
    range: Material
    multivalued: true
    description: "Ephemeral materials consumed during the ritual (e.g., oil, rice)."

  enshrined_deity:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of occurred_in_presence_of.
    slot_uri: heritageGraph:enshrinedDeity
    is_a: occurred_in_presence_of
    range: Deity
    description: "Deity installed through enshrinement"
    inverse: is_enshrined_through_event

  enshrined_in_structure:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of
    # ritual_on_structure (canonical crm:P8 holder; Temple is a
    # PhysicalHeritageThing member).
    slot_uri: heritageGraph:enshrinedInStructure
    is_a: ritual_on_structure
    range: Temple
    description: "Temple where deity was enshrined"
    inverse: enshrines_deity_through_event

  is_enshrined_through_event:
    slot_uri: heritageGraph:isEnshrinedThroughEvent
    range: Enshrinement
    multivalued: true
    description: "Events where this deity was enshrined"
    inverse: enshrined_deity

  depicts_deity:
    slot_uri: crm:P62_depicts
    range: Deity
    multivalued: true
    description: "Deity depicted iconographically (not cultic presence)"


  is_depicted_in:
    slot_uri: crm:P62i_is_depicted_by
    range: IconographicObject
    multivalued: true
    description: "Iconographic objects (murti, paubha) in which this deity is depicted."

  is_about_deity:
    # CRM D/R FIX (alpha.5): P129_is_about has domain E89 Propositional Object;
    # a Murti is physical, so this was a domain violation. Now a minted
    # specialization of depicts_deity (rdfs:subPropertyOf crm:P62_depicts,
    # whose E24 domain and E1 range fit; P62 is CRM's official depiction
    # shortcut of P65+P138).
    slot_uri: heritageGraph:isAboutDeity
    is_a: depicts_deity
    range: Deity
    description: "Deity represented and ritually associated with the Murti"

  consecrated_by_event:
    slot_uri: heritageGraph:consecratedByEvent
    range: Consecration
    description: "Consecration event that activated this murti"
    # NO INVERSE (1.1.0): declaring this the inverse of consecrated_object
    # (crm:P16_used_specific_object) entailed that every object used in any
    # CIDOC-CRM activity was consecrated by that activity, changing CRM's
    # meaning. The two slots are deliberately independent.

  consecrated_object:
    # CRM D/R FIX (alpha.5): P11_had_participant has range E39 Actor; a Murti
    # is not an actor. P16_used_specific_object (E7 -> E70 Thing) is the
    # official CRM property for an object employed in an activity.
    slot_uri: crm:P16_used_specific_object
    range: Murti
    description: "Murti employed in (and transformed by) the consecration ritual"

  makes_deity_present:
    slot_uri: heritageGraph:makesDeityPresent
    range: Deity
    description: "Deity made present through consecration"

  is_invoked_in_ritual:
    # PREDICATE FIX (alpha.5/OOPS P19): minted subproperty of was_present_at.
    slot_uri: heritageGraph:isInvokedInRitual
    is_a: was_present_at
    range: RitualEvent
    inverse: invokes_deity
    multivalued: true
    description: "Rituals where this deity is invoked"

  # --- GUTHI RELATIONSHIPS ---

  managed_by_guthi:
    slot_uri: heritageGraph:managedByGuthi
    # The Guthi that administers a structure or a ritual (funds, schedules,
    # duties). Not a subproperty of crm:P49 has former or current keeper:
    # P49's domain E18 would make a managed ritual a physical thing. Custody of
    # a structure is crm:P50 / P50i (holds_custody_of) or a CustodyPeriod.
    related_mappings:
      - crm:P49_has_former_or_current_keeper
    range: Guthi
    multivalued: true
    description: "Guthi organization managing this structure or ritual"


  performs_ritual:
    # PREDICATE FIX (alpha.5): previously duplicated crm:P14i_performed with
    # carried_out_activity. carried_out_activity keeps the CRM predicate as the
    # canonical general form; this is now its minted subproperty
    # (rdfs:subPropertyOf crm:P14i_performed via is_a).
    slot_uri: heritageGraph:performsRitual
    # Not declared the inverse of performed_by_group: that slot is also used on
    # Kumari selection and retirement events, which are not rituals, and an
    # inverse would make them RitualEvents through this slot's range.
    is_a: carried_out_activity
    range: RitualEvent
    multivalued: true
    description: "Rituals performed by this Guthi"

  holds_custody_of:
    # CRM D/R FIX (alpha.5): P50_has_current_keeper points thing -> keeper;
    # this slot points keeper -> thing. Corrected to the official inverse.
    slot_uri: crm:P50i_is_current_keeper_of
    range: ArchitecturalStructure
    multivalued: true
    description: "Structures under Guthi custodianship"

