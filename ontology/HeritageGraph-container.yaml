id: https://cair-nepal.org/heritagegraph/container-schema
name: HeritageGraphContainer
title: HeritageGraph data container
description: "Serialization wrapper for HeritageGraph JSON/YAML data files. It imports the
  HeritageGraph schema and adds the LinkML tree_root (Container) with one collection per class,
  plus the dataset header (Metadata). It is used only to generate the JSON Schema
  (HeritageGraph.schema.json) and to validate JSON/YAML data; the OWL ontology and SHACL shapes are
  generated from HeritageGraph.yaml alone. RDF instance data does not need a Container node."
version: 1.0.1
license: CC-BY-4.0

imports:
  - linkml:types
  - HeritageGraph

prefixes:
  linkml: "https://w3id.org/linkml/"
  heritageGraph: "https://cair-nepal.org/heritagegraph/"
  prov: "http://www.w3.org/ns/prov#"

default_prefix: heritageGraph
default_range: string

classes:
  Container:
    tree_root: true
    description: "Root container for cultural heritage data instances. PLACEMENT RULE: put each instance in
      the most specific collection available (e.g. a Festival in festivals, not ritual_events; a Person in
      persons, not actors); broader collections exist for instances of the general classes only."
    # CONTAINER STATUS (1.1.0): defined here, not in HeritageGraph.yaml, so it
    # never reaches the OWL or SHACL release. The LinkML tree_root is what makes
    # JSON/YAML data files loadable; the JSON Schema is generated from this file.
    annotations:
      design_note: 'Serialization construct, not a domain class: this is the LinkML tree_root
        that anchors JSON/YAML dataset serializations (its collection properties exist for
        data exchange only). Reasoners and domain queries should ignore it; RDF instance
        data does not need a Container node.'
    broad_mappings:
      - prov:Collection
    mixins:
      - Entity
    attributes:
      places:
        description: "Collection of Place instances"
        range: Place
        multivalued: true
        inlined: true
        inlined_as_list: true

      calendar_systems:
        description: "Collection of CalendarSystem instances"
        range: CalendarSystem
        multivalued: true
        inlined: true
        inlined_as_list: true

      syncretic_relationships:
        description: "Collection of SyncreticRelationship instances"
        range: SyncreticRelationship
        multivalued: true
        inlined: true
        inlined_as_list: true


      physical_heritage_things:
        description: "Collection of all physical heritage objects"
        range: PhysicalHeritageThing
        multivalued: true
        inlined: true
        inlined_as_list: true
      religious_traditions:
        description: "Collection of ReligiousTradition instances"
        range: ReligiousTradition
        multivalued: true
        inlined: true
        inlined_as_list: true

      deities:
        description: "Collection of Deity instances"
        range: Deity
        multivalued: true
        inlined: true
        inlined_as_list: true

      # CONTAINER FIX (alpha.5): removed the 'has_architectural_style'
      # attribute -- it shadowed the global slot of the same name and declared
      # an inlined instance collection over an enum (enums have no instances).


      architectural_elements:
        description: "Collection of ArchitecturalElement instances"
        range: ArchitecturalElement
        multivalued: true
        inlined: true
        inlined_as_list: true

      persons:
        description: "Collection of Person instances"
        range: Person
        multivalued: true
        inlined: true
        inlined_as_list: true

      caste_groups:
        description: "Collection of CasteGroup instances"
        range: CasteGroup
        multivalued: true
        inlined: true
        inlined_as_list: true

      guthis:
        description: "Collection of Guthi instances"
        range: Guthi
        multivalued: true
        inlined: true
        inlined_as_list: true

      production_events:
        description: "Collection of Production event instances"
        range: Production
        multivalued: true
        inlined: true
        inlined_as_list: true

      enshrinement_events:
        description: "Collection of Enshrinement event instances"
        range: Enshrinement
        multivalued: true
        inlined: true
        inlined_as_list: true

      consecration_events:
        description: "Collection of Consecration event instances"
        range: Consecration
        multivalued: true
        inlined: true
        inlined_as_list: true

      ritual_events:
        description: "Collection of RitualEvent instances"
        range: RitualEvent
        multivalued: true
        inlined: true
        inlined_as_list: true

      festivals:
        description: "Collection of Festival instances"
        range: Festival
        multivalued: true
        inlined: true
        inlined_as_list: true

      custody_events:
        description: "Collection of TransferOfCustody event instances"
        range: TransferOfCustody
        multivalued: true
        inlined: true
        inlined_as_list: true

      data_sources:
        description: "Collection of DataSource instances"
        range: DataSource
        multivalued: true
        inlined: true
        inlined_as_list: true

      data_custodians:
        description: "Collection of DataCustodian instances"
        range: DataCustodian
        multivalued: true
        inlined: true
        inlined_as_list: true

      assertions:
        description: "Collection of Assertion instances"
        range: Assertion
        multivalued: true
        inlined: true
        inlined_as_list: true

      documentation_activities:
        description: "Collection of DocumentationActivity instances"
        range: DocumentationActivity
        multivalued: true
        inlined: true
        inlined_as_list: true
      information_objects:
        description: "Collection of InformationObject instances"
        range: InformationObject
        multivalued: true
        inlined: true
        inlined_as_list: true



      human_made_objects:
        description: "Collection of generic HumanMadeObject instances (use structures / iconographic_objects for subclasses)"
        range: HumanMadeObject
        multivalued: true
        inlined: true
        inlined_as_list: true

      structures:
        description: "Collection of ArchitecturalStructure instances (incl. subclasses)"
        range: ArchitecturalStructure
        multivalued: true
        inlined: true
        inlined_as_list: true

      iconographic_objects:
        description: "Collection of IconographicObject instances (incl. Murti, Paubha)"
        range: IconographicObject
        multivalued: true
        inlined: true
        inlined_as_list: true

      # CONTAINER FIX (alpha.5): collections added so every top-level class
      # (incl. the Kumari module, historical events, condition data, time
      # spans and techniques) can be instantiated under the tree root.
      actors:
        description: "Collection of generic Actor instances"
        range: Actor
        multivalued: true
        inlined: true
        inlined_as_list: true

      historical_events:
        description: "Collection of HistoricalEvent (incl. DestructionEvent) instances"
        range: HistoricalEvent
        multivalued: true
        inlined: true
        inlined_as_list: true

      condition_assessments:
        description: "Collection of ConditionAssessment instances"
        range: ConditionAssessment
        multivalued: true
        inlined: true
        inlined_as_list: true

      condition_states:
        description: "Collection of ConditionState instances"
        range: ConditionState
        multivalued: true
        inlined: true
        inlined_as_list: true

      time_spans:
        description: "Collection of TimeSpan instances"
        range: TimeSpan
        multivalued: true
        inlined: true
        inlined_as_list: true

      techniques:
        description: "Collection of Technique instances"
        range: Technique
        multivalued: true
        inlined: true
        inlined_as_list: true

      kumari_tenures:
        description: "Collection of KumariTenure instances"
        range: KumariTenure
        multivalued: true
        inlined: true
        inlined_as_list: true

      kumari_roles:
        description: "Collection of KumariRole instances"
        range: KumariRole
        multivalued: true
        inlined: true
        inlined_as_list: true

      kumari_lifecycle_events:
        description: "Collection of Kumari lifecycle events (selection, enthronement, retirement)"
        range: KumariLifecycleEvent
        multivalued: true
        inlined: true
        inlined_as_list: true

      selection_criteria:
        description: "Collection of SelectionCriterion instances"
        range: SelectionCriterion
        multivalued: true
        inlined: true
        inlined_as_list: true

      ritual_assessments:
        description: "Collection of RitualAssessment (e.g. FearlessnessAssessment) instances"
        range: RitualAssessment
        multivalued: true
        inlined: true
        inlined_as_list: true

      propositions:
        description: "Collection of Proposition instances referenced by assertions"
        range: Proposition
        multivalued: true
        inlined: true
        inlined_as_list: true

      materials:
        description: "Collection of Material instances"
        range: Material
        multivalued: true
        inlined: true
        inlined_as_list: true

      endowments:
        description: "Collection of Endowment instances"
        range: Endowment
        multivalued: true
        inlined: true
        inlined_as_list: true
        # added after the OWL release stopped carrying container terms: no OWL IRI
        annotations:
          since: "1.1.0"

      endowment_events:
        description: "Collection of EndowmentEvent instances"
        range: EndowmentEvent
        multivalued: true
        inlined: true
        inlined_as_list: true
        # added after the OWL release stopped carrying container terms: no OWL IRI
        annotations:
          since: "1.1.0"

      hereditary_role_tenures:
        description: "Collection of HereditaryRoleTenure instances"
        range: HereditaryRoleTenure
        multivalued: true
        inlined: true
        inlined_as_list: true
        # added after the OWL release stopped carrying container terms: no OWL IRI
        annotations:
          since: "1.1.0"

      custody_periods:
        description: "Collection of CustodyPeriod instances"
        range: CustodyPeriod
        multivalued: true
        inlined: true
        inlined_as_list: true
        # added after the OWL release stopped carrying container terms: no OWL IRI
        annotations:
          since: "1.1.0"

      metadata:
        title: "has metadata"
        description: "Dataset metadata"
        range: Metadata
        # CONTAINER FIX (alpha.5): Metadata carries an identifier (Entity
        # mixin), so without inlined:true serializers expect a string
        # reference here; the intent is an embedded object.
        inlined: true

  Metadata:
    description: "Dataset metadata information"
    mixins:
      - Entity
    attributes:
      dataset_name:
        range: string
        description: "Human-readable name of the dataset."
      dataset_version:
        range: string
        description: "Version identifier of the dataset instance."
      schema_version:
        range: string
        description: "HeritageGraph schema version the dataset conforms to."
      generated_date:
        range: string
        description: "Date the dataset serialization was generated (ISO 8601)."
      license:
        range: string
        description: "License under which the dataset is released."
      curator:
        range: string
        description: "Person or organization curating the dataset."
