name: Generate Ontology Docs

on:
  push:
    branches:
      - main
      - HeritageGraph
  workflow_dispatch:

# the Pages deploy pushes to gh-pages; newer repositories give GITHUB_TOKEN read-only access by default
permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # pinned toolchain that built the release (unpinned LinkML regenerates different SHACL)
          pip install -r requirements-build.txt

      - name: Generator unit tests
        run: |
          pip install pytest
          python3 -m pytest -q tests/

      - name: Committed OWL/SHACL generated from the committed YAML
        run: python3 scripts/check_yaml_ttl_sync.py

      - name: OWL, SHACL and JSON Schema in lockstep with the YAML
        run: python3 evaluation/artifact_lockstep.py

      - name: SHACL conformance of the examples and negative tests
        run: python3 evaluation/independent_abox.py

      - name: Regenerate ontology artefacts
        run: |
          python3 scripts/finalize_alpha5_artifacts.py
          python3 scripts/gen_jsonld_context.py
          python3 scripts/gen_cq_tbox_doc.py

      - name: Set up Java (ROBOT / HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download ROBOT 1.9.8
        run: |
          mkdir -p .tools
          curl -fsSL -o .tools/robot.jar https://github.com/ontodev/robot/releases/download/v1.9.8/robot.jar

      - name: Every hg term used in examples/queries/evaluation is declared
        run: python3 evaluation/check_declared_terms.py

      - name: Every '?x a C ; p ?y' pattern in the CQs uses a property declared for C
        run: python3 evaluation/check_cq_class_properties.py

      - name: Ontology + each example ABox is OWL 2 DL and HermiT-consistent
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/check_combined_dl.py

      - name: Inconsistency injection (the OWL axioms bite)
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/reasoning_extras.py injection

      - name: Core + LUX + CIDOC-CRM give no external class an HG superclass
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/reasoning_extras.py no-external-superclass

      - name: Core + LUX + CIDOC-CRM + demonstrator infer no KumariTenure to be crm:E5_Event
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/reasoning_extras.py tenure-not-event

      - name: LUX module + CIDOC-CRM give HG data no contradictory CRM type and no unentailed core class
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/reasoning_extras.py lux-conservativity

      - name: Core + CIDOC-CRM give no subject of an HG property both E2 and E77
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/reasoning_extras.py core-crm-disjointness

      - name: Every example ABox is consistent with HG + CRM + CRMinf + CRMsci + PROV-O
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/reasoning_extras.py merged-abox

      - name: Merged-vocabulary classification, with and without the CRM-PROV bridge
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/reasoning_extras.py merged-import

      - name: Competency questions match their expected answer sets
        run: python3 evaluation/run_abox_cq32.py

      - name: cq_sparql.md is generated from the committed CQ queries
        run: python3 scripts/gen_cq_tbox_doc.py --check

      - name: The SSSOM mapping set is generated from the committed mappings
        run: python3 scripts/gen_sssom.py --check

      - name: Inference CQs are answered only with HeritageGraph's axioms
        run: python3 evaluation/run_inference_cq.py

      - name: Multi-calendar resolution and conversion
        run: python3 evaluation/pattern_experiments.py multicalendar

      - name: Tenure pattern reused outside Nepal (RQ3)
        run: python3 evaluation/pattern_experiments.py reuse

      - name: Tenure against the CRM role and Wikidata P39 idioms; custody and endowment scenario
        run: |
          python3 evaluation/pattern_experiments.py tenure
          python3 evaluation/pattern_experiments.py custodianship

      - name: Run ontology evaluation suite
        run: python3 scripts/run_release_quality.py

      - name: Generate documentation with OntoReview (term pages, graph, quality report, changelog)
        run: |
          # own environment, so OntoReview's dependencies cannot change the pinned build toolchain
          python3 -m venv .ontoreview
          .ontoreview/bin/pip install ontoreview==1.0.1 certifi
          ONTOREVIEW=.ontoreview/bin/ontoreview ROBOT_JAR=.tools/robot.jar bash scripts/build.sh "${GITHUB_WORKSPACE}/docs"

      - name: Add .nojekyll
        run: touch docs/.nojekyll


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
