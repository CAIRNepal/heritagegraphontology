name: Generate Ontology Docs

on:
  push:
    branches:
      - main
      - HeritageGraph
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install linkml rdflib owlrl pyyaml requests owlready2
          pip install -r evaluation/requirements.txt

      - name: Committed OWL/SHACL generated from the committed YAML
        run: python3 scripts/check_yaml_ttl_sync.py

      - name: Regenerate ontology artefacts
        run: |
          python3 scripts/finalize_alpha5_artifacts.py
          python3 scripts/gen_jsonld_context.py
          python3 scripts/gen_cq_tbox_doc.py

      - name: Set up Java (ROBOT / HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download ROBOT 1.9.8
        run: |
          mkdir -p .tools
          curl -fsSL -o .tools/robot.jar https://github.com/ontodev/robot/releases/download/v1.9.8/robot.jar

      - name: Every hg term used in examples/queries/evaluation is declared
        run: python3 evaluation/check_declared_terms.py

      - name: Ontology + each example ABox is OWL 2 DL and HermiT-consistent
        run: ROBOT_JAR=.tools/robot.jar python3 evaluation/check_combined_dl.py

      - name: Competency questions match their expected answer sets
        run: python3 evaluation/run_abox_cq32.py

      - name: Run ontology evaluation suite
        run: python3 scripts/run_release_quality.py

      - name: Generate documentation (Widoco + WebVOWL) from the modular ontology
        run: bash scripts/build.sh "${GITHUB_WORKSPACE}/docs"

      - name: Refresh docs metadata from release TTL
        run: python3 scripts/refresh_docs_metadata.py

      - name: Add .nojekyll
        run: touch docs/.nojekyll


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
