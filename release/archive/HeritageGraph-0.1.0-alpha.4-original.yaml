      - is_about
      - was_generated_by
      - was_documented_by
      - source_language
  Verification:
    is_a: DocumentationActivity
    class_uri: heritageGraph:Verification
    description: "Process of cross-checking heritage claims against multiple sources"
    slots:
      - verification_method
      - note
      - verified_assertion
      - verified_by_expert
    broad_mappings:
      - prov:Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
  DataCustodian:
    class_uri: heritageGraph:DataCustodian
    description: "Institution or person currently responsible for stewarding heritage data."
    slots:
      - name
      - custodian_type
      - note
    is_a: Actor
    broad_mappings:
