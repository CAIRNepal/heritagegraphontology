      - has_timespan
      - took_place_at
  SyncreticRelationship:
    class_uri: crm:E13_Attribute_Assignment
    description: "Formalizes the syncretic equivalence between divine entities across different theological frameworks.
      Following CIDOC CRM E13, it treats syncretism as a propositional claim with associated epistemic authority
      and provenance."
    slots:
      - name
      - note
      - assigned_to_deity
      - assigned_equivalent
      - syncretic_type
      - used
      - was_documented_by
      - documented_in_source
    mixins:
      - Activity
  KumariTenure:
    class_uri: heritageGraph:KumariTenure
    description: "Time-bounded role where a person embodies a deity as Living Goddess (Kumari), residing at a specific
      god-house and supported by religious institutions. This class captures the unique Nepali tradition of living
      deity embodiment in young girls selected from Buddhist Shakya/Vajracharya families."
    slots:
      - name
      - had_participant
      - embodied_deity
      - residence_structure
      - has_timespan
      - supported_by_institution
      - has_retirement_event
      - was_documented_by
      - assumes_role
      - selected_through
      - enthroned_through
      - retired_through
    slot_usage:
      name:
        required: true
        description: "Name of this tenure period (e.g., 'Kumari Samita Bajracharya Tenure 2015-2023')"
      had_participant:
        required: true
        range: Person
        description: "The girl serving as Living Goddess during this period"
      embodied_deity:
        required: true
        range: Deity
        description: "Deity believed to be present in this person (e.g., Taleju, Kumari Devi)"
      residence_structure:
        required: true
        range: ArchitecturalStructure
        description: "God-house where Living Goddess resides (e.g., Kumari Ghar)"
      has_timespan:
        required: true
        range: TimeSpan
        description: "Duration of Living Goddess tenure (from selection to retirement)"
      supported_by_institution:
        range: Guthi
        multivalued: true
        description: "Guthi or state body providing economic/ritual support during tenure"



    mixins:
      - Entity
  KumariLifecycleEvent:
    is_a: RitualEvent
    abstract: true
    class_uri: heritageGraph:KumariLifecycleEvent
    broad_mappings:
      - prov:Activity
    exact_mappings:
      - crm:E7_Activity
    description: 'Abstract event that bounds a KumariTenure (selection, enthronement, or retirement). Shared axiom:
      every instance references some KumariTenure via bounds_tenure.'
    slots:
      - bounds_tenure
  KumariSelectionEvent:
    is_a: KumariLifecycleEvent
    class_uri: heritageGraph:KumariSelectionEvent
    description: " Tantric ritual process of selecting a new Living Goddess from eligible candidates. Involves examination
      of 32 auspicious physical marks (lakshana), horoscope matching with the city and ruling authority, and tests
      of fearlessness (e.g., remaining calm among buffalo heads and masked dancers in darkness). Performed by committee
      of Vajracharya priests, royal priest (Raj Jyotish), and astrologer."


    
    exact_mappings:
      - crm:E7_Activity

    slots:
      - name
      - selected_person
      - initiated_tenure
      - has_timespan
      - carried_out_by
      - performed_by_group
      - took_place_at
      - selection_criteria_met
      - has_assertion
      - was_documented_by
      - is_critical_for_festival
      - has_criterion
      - results_in_role
    slot_usage:
      name:
        required: true
        description: "Name of selection event"
      selected_person:
        required: true
        range: Person
        description: "Girl selected to become Living Goddess"
      initiated_tenure:
        required: true
        range: KumariTenure
        description: "Living Goddess tenure that this selection event initiated"
      selection_criteria_met:
        range: string
        multivalued: true
        description: "List of selection criteria verified"

  
    broad_mappings:
      - prov:Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
  Technique:
