id: https://w3id.org/heritagegraph/schema
name: HeritageGraph
description: "An event-centric LinkML schema for representing cultural heritage information that fully aligns with
  CIDOC-CRM and PROV-O, enabling provenance tracking and ritual-spatial-temporal reasoning."
version: 0.1.0-alpha.4
license: CC-BY-4.0


imports:
  - linkml:types
default_range: string

types:
  wktLiteral:
    typeof: string
    uri: "http://www.opengis.net/ont/geosparql#wktLiteral"

enums:
  ConditionType:
    permissible_values:
      Good:
        description: "No significant damage"
      Damaged:
        description: "Partially damaged"
      Ruined:
        description: "Severely damaged or collapsed"
      Restored:
        description: "Repaired and stabilized"


  ExistenceStatus:
    permissible_values:
      Extant:
        description: "Currently exists in physical form"
      PartiallyExtant:
        description: "Fragments or ruins remain"
      Destroyed:
        description: "Known to have been destroyed; no physical remains"
      Lost:
        description: "Existence documented but location/remains unknown"
      Hypothetical:
        description: "Reconstructed or theorized; never physically realized"
      Unknown:
        description: "Existence status uncertain"

  RitualType:
    permissible_values:
      NityaPuja:
        description: "Daily mandatory worship"
        exact_mappings:
          - aat:300055603
      NaimittikaPuja:
        description: "Occasional/Festival worship"
      KamyaPuja:
        description: "Desire-based optional worship"
      Abhisheka:
        description: "Ritual bathing/anointing of deity"
        exact_mappings:
          - aat:300264383
      Homa:
        description: "Fire offering ritual"
        exact_mappings:
          - aat:300264387
      Bhajan:
        description: "Devotional singing ritual"
        exact_mappings:
          - aat:300264388
      Yagna:
        description: "Vedic sacrifice ritual"
        exact_mappings:
          - aat:300264386
      Vrata:
        description: "Vow observance ritual"
        exact_mappings:
          - aat:300264389
      Jatra:
        description: "Festival procession ritual"
        exact_mappings:
          - aat:300264390
      ChariotProcession:
        description: "Ritual chariot pulling"
        exact_mappings:
          - aat:300254776
      MaskedPerformance:
        description: "Ritual masked dance"
        exact_mappings:
          - aat:300264391


      RitualConsecration:
        description: "Consecration/activation ritual"
      ProcessionRitual:
        description: "Ritual procession/movement"
      InstallationRitual:
        description: "Installation/enshrinement ritual"
      DeinstallationRitual:
        description: "De-installation/conclusion ritual"
      ReturningRitual:
        description: "Return to normal state ritual"

      Circumambulation:
        description: "Ritual circular movement around sacred site"
      RelicTour:
        description: "Procession with sacred relics between sites"
      ProcessionalMovement:
        description: "General ritual movement between locations"

  
    annotations:
      design_note: 'RitualType currently mixes three orthogonal axes: worship-frequency (NityaPuja/NaimittikaPuja/KamyaPuja),
        ritual form (Homa/Jatra/MaskedPerformance), and lifecycle (InstallationRitual/ReturningRitual). Consider
        splitting into RitualFrequency + RitualForm. Also: Circumambulation/ProcessionalMovement/ProcessionRitual/RelicTour
        overlap with RitualEvent.route_places/start_place/end_place/route_description -- pick one canonical mechanism
        for moving rituals.'
  DatePrecision:
    permissible_values:
      Exact:
        description: "Precise date known"
      Year:
        description: "Year-level precision only"
      Decade:
        description: "Within 10-year range"
      Century:
        description: "Within century range"
      Circa:
        description: "Approximate date"

  #Syncretic relationship types
  SyncreticType:
    permissible_values:
      Equivalence:
        description: "Same deity in different traditions (e.g., Avalokiteshvara = Matsyendranath)"
      Appropriation:
        description: "Deity borrowed from one tradition into another"
      Fusion:
        description: "Intrinsically syncretic deity merging multiple traditions"
      Historical:
        description: "Gradual syncretism over time"

  
  ArchitecturalStyle:
    description: "A vocabulary of architectural styles for South Asian heritage, mapped to CIDOC E55 Type."
    enum_uri: crm:E55_Type
    permissible_values:
      Pagoda:
        description: "Multi-tiered roof style indigenous to Nepal"
        meaning: aat:300004829
      Shikhara:
        description: "North Indian spire-shaped style"
        meaning: aat:300446671
      Dome:
        description: "Dome-based style (Mughal/Neo-classical influence)"
        meaning: aat:300001285
      Chaitya:
        description: "Buddhist votive shrine style"
        meaning: aat:300007562
      Stupa:
        description: "Buddhist dome-shaped reliquary"
        meaning: aat:300007576

  #Guthi type enum
  GuthiType:
    description: "Controlled vocabulary of Guthi functional types (CRM E55_Type)"
    permissible_values:
      SiGuthi:
        description: "Funeral trust"
      JatraGuthi:
        description: "Festival organization trust"
      PujaGuthi:
        description: "Daily worship trust"
      TempleGuthi:
        description: "Temple maintenance trust"
      NashaGuthi:
        description: "Music and dance trust"
      SanaGuthi:
        description: "Agricultural cooperative trust"
      SanGuthi:
        description: "Life-cycle ritual trust"
      RajGuthi:
        description: "Royal endowment trust"



prefixes:
  heritageGraph: "https://w3id.org/heritagegraph/"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  owl: "http://www.w3.org/2002/07/owl#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  skos: "http://www.w3.org/2004/02/skos/core#"
  dcterms: "http://purl.org/dc/terms/"
  dct: "http://purl.org/dc/terms/"
  geo: "http://www.opengis.net/ont/geosparql#"
  time: "http://www.w3.org/2006/time#"
  wgs84: "http://www.w3.org/2003/01/geo/wgs84_pos#"
  aat: "http://vocab.getty.edu/aat/"
  tgn: "http://vocab.getty.edu/tgn/"
  wikidata: "http://www.wikidata.org/entity/"
  schema: "https://schema.org/"
  dbo: "http://dbpedia.org/ontology/"
  foaf: "http://xmlns.com/foaf/0.1/"
  prov: "http://www.w3.org/ns/prov#"
  crm: "http://www.cidoc-crm.org/cidoc-crm/"
  crmsci: "http://www.cidoc-crm.org/crmsci/"
  crmdig: "http://www.cidoc-crm.org/crmdig/"
  crminf: "http://www.cidoc-crm.org/crminf/"
  rico: "https://www.ica.org/standards/RiC/ontology#"
  datacite: "http://purl.org/spar/datacite/"

default_prefix: heritageGraph

annotations:
  owl:ontologyIRI: "https://w3id.org/heritagegraph/ontology"
  owl:versionIRI: "https://w3id.org/heritagegraph/ontology/0.1.0-alpha.4"
  dcterms:creator: "CAIR-Nepal"
  dcterms:publisher: "CAIR-Nepal"
  dcterms:license: "https://creativecommons.org/licenses/by/4.0/"
  owl:imports: "http://www.cidoc-crm.org/cidoc-crm/ http://www.w3.org/ns/prov#"

classes:
  # ========================================================================
  # PROV-O STARTING-POINT CLASSES (DIRECT PROV URIs)
  # ========================================================================
  Entity:
    abstract: true
    mixin: true
    class_uri: prov:Entity
    description: Direct LinkML representation of prov:Entity. Applied to physical, digital, conceptual, and 
      assertion-bearing things that participate in provenance relations.
    slots:
      - id
      - was_derived_from
      - was_attributed_to
      - was_generated_by
      - generated_at_time
      - was_influenced_by
  Activity:
    abstract: true
    mixin: true
    class_uri: prov:Activity
    description: Direct LinkML representation of prov:Activity. Applied to events and processes that use, 
      transform, generate, document, assess, or verify entities.
    slots:
      - id
      - used
      - generated
      - was_associated_with
      - was_informed_by
      - was_influenced_by
      - started_at_time
      - ended_at_time
  Agent:
    abstract: true
    mixin: true
    class_uri: prov:Agent
    description: Direct LinkML representation of prov:Agent. Agents bear responsibility for activities or entities. PROV-O permits an individual agent also to be typed as an Entity, but does not define every Agent as a subclass of Entity.
    slots:
      - id
      - acted_on_behalf_of
      - was_influenced_by
  # ========================================================================
  # CORE TANGIBLE HERITAGE (CIDOC E22 Human-Made Objects)
  # ========================================================================
  HumanMadeObject:
    class_uri: crm:E22_Human-Made_Object
    description: "Physical objects created by human activity"
    exact_mappings:
      - schema:CreativeWork
      - aat:300033618
      - wikidata:Q838948

    slots:
      - id
      - name
      - has_current_location
      - was_produced_by_event
      - has_condition_assessment
      - participates_in_ritual
      - has_custody_event
      - was_documented_by
    mixins:
      - Entity
  ArchitecturalStructure:
    is_a: HumanMadeObject
    class_uri: heritageGraph:ArchitecturalStructure

    description: "Physical structures built for religious, social, or civic purposes. Links to events of production,
      use, custody, and documentation."
    exact_mappings:
      - aat:300006888
      - schema:Place
      - wikidata:Q811979
      - crm:E22_Human-Made_Object
    slots:
      - name
      - note
      - was_produced_by_event
      - has_current_location
      - has_condition_assessment
      - has_component
      - has_architectural_style
      - existence_status
      - last_known_existence_date
      - destruction_event
      - hypothesized_location
      - documented_in_source
      - has_assertion
    slot_usage:
      name:
        required: true
      has_current_location:
        required: true
        minimum_cardinality: 1
        maximum_cardinality: 1

  ReligiousStructure:
    is_a: ArchitecturalStructure
    class_uri: heritageGraph:ReligiousStructure
    description: 'Architectural structure whose defining purpose is religious: enshrines a deity and/or is a locus
      of ritual activation. Abstract grouping for sacred structures across traditions (temple, stupa, chaitya).'
    exact_mappings:
      - aat:300007596
  Temple:
    is_a: ReligiousStructure
    class_uri: heritageGraph:Temple

    description: "Religious structure characterized by deity enshrinement and ritual activation. Legal designation
      (e.g. 'Ancient Monument' under Nepal law) is recorded per-instance via a governance assertion, not as a class
      criterion."
    exact_mappings:
      - aat:300007595
      - wikidata:Q44539
      - dbo:ReligiousBuilding
      - dbo:Temple
    close_mappings:
      - schema:PlaceOfWorship
      - schema:HinduTemple
    slots:
      - enshrines_deity_through_event
      - has_architectural_style
    slot_usage:
      has_architectural_style:
        required: true




  Stupa:
    is_a: ReligiousStructure
    class_uri: heritageGraph:Stupa
    description: "Buddhist dome-shaped reliquary shrine with circumambulation and ritual activation (e.g., Boudhanath,
      Swayambhunath)."

    exact_mappings:
      - aat:300007576
      - wikidata:Q177980
    disjoint_with:
      - Chaitya
  Chaitya:
    is_a: ReligiousStructure
    class_uri: heritageGraph:Chaitya
    description: "Buddhist votive shrine (chaitya); votive stupa form found across the Kathmandu Valley."

  RestHouse:
    is_a: ArchitecturalStructure
    class_uri: heritageGraph:RestHouse
    description: "Community structures for travelers and pilgrims, maintained by Guthi organizations"

  Pati:
    is_a: RestHouse
    class_uri: heritageGraph:Pati
    description: "Open-air pavilion for resting travelers"

  Sattal:
    is_a: RestHouse
    class_uri: heritageGraph:Sattal
    description: "Multi-story rest house (3-5 floors) with ritual and social functions"

  Dharmashala:
    is_a: RestHouse
    class_uri: heritageGraph:Dharmashala
    description: "Pilgrim lodge operated by a Guthi organization"

  WaterStructure:
    is_a: ArchitecturalStructure
    class_uri: heritageGraph:WaterStructure
    description: "Engineered water supply systems with ritual and civic significance"

  DhungeDhara:
    is_a: WaterStructure
    class_uri: heritageGraph:DhungeDhara
    description: "Stone spout (hiti) with carved imagery, used for ritual bathing and daily water supply"

  Pokhari:
    is_a: WaterStructure
    class_uri: heritageGraph:Pokhari
    description: "Pond or tank for water storage, ritual bathing, and ecological management"

  IconographicObject:
    is_a: HumanMadeObject
    class_uri: heritageGraph:IconographicObject
    description: "Sacred visual art objects that depict or embody deities through iconographic conventions"
    exact_mappings:
      - aat:300033618
      - aat:300041273
      - dbo:Artwork
      - crm:E22_Human-Made_Object
    close_mappings:
      - crm:E36_Visual_Item

    slots:
      - name
      - note
      - depicts_deity
      - was_produced_by_event
      - participates_in_ritual
      - has_current_location
      - used_by
  Paubha:
    is_a: IconographicObject
    class_uri: heritageGraph:Paubha
    exact_mappings:
      - aat:300033618
      - wikidata:Q130993
    description: "Traditional Newari scroll painting (thangka) with mandala and deity iconography"

  Murti:
    is_a: IconographicObject
    class_uri: heritageGraph:Murti
    description: "Consecrated statue of a deity, ritually activated to serve as divine presence (not merely depiction)"
    exact_mappings:
      - aat:300264383
      - wikidata:Q2594295
    slots:
      - consecrated_by_event
      - is_about_deity
  ArchitecturalElement:
    class_uri: crm:E25_Architectural_Element
    description: "Carved or constructed component of a architectural strucuture (e.g., Gajur, Torana, Tundal)"
    exact_mappings:
      - aat:300001819
    slots:
      - name
      - note
      - is_component_of
    slot_usage:
      name:
        required: true
      is_component_of:
        required: true

  # ========================================================================
  # CONCEPTUAL ENTITIES (CIDOC E28 Conceptual Objects)
  # ========================================================================

    mixins:
      - Entity
  PhysicalHeritageThing:
    class_uri: heritageGraph:PhysicalHeritageThing
    union_of:
      - ArchitecturalStructure
      - IconographicObject
      - ArchitecturalElement


    mixins:
      - Entity
  Deity:
    class_uri: crm:E28_Conceptual_Object
    description: "Divine conceptual entity in Hindu, Buddhist, or syncretic traditions. Distinct from physical representations
      (Murti) and ritual presences."
    exact_mappings:
      - aat:300343156
      - dbo:Deity
      - schema:Deity
    slots:
      - name
      - note
      - has_religious_tradition
      - is_depicted_in
      - is_invoked_in_ritual
      - is_enshrined_through_event
    mixins:
      - Entity
  ReligiousTradition:
    class_uri: crm:E55_Type
    description: "Religious or philosophical tradition (e.g., Hindu, Buddhist, Syncretic)"
    exact_mappings:
      - aat:300073708
    slots:
      - name
      - note
    mixins:
      - Entity
  HistoricalEvent:
    class_uri: crm:E5_Event
    description: "Major event affecting heritage structures or ritual life (earthquake, epidemic, political transition,
      fire, flood)."
    slots:
      - name
      - note
      - has_timespan
      - took_place_at
      - architectural_structures
      - includes_ritual_event
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  CalendarSystem:

    class_uri: time:Calendar
    exact_mappings:
      - time:Calendar
      - crm:E29_Designated_Reference_System
    description: "Calendar reckoning system with conversion rules for multi-calendar temporal reasoning"
    slots:
      - name
      - epoch_date_gregorian
      - is_primary_for_tradition
      - year_offset_from_gregorian
      - note
    slot_usage:
      name:
        required: true

  # ========================================================================
  # EVENT CLASSES (CIDOC-CRM Event-Centric Core)
  # ========================================================================

    mixins:
      - Entity
  Production:
    class_uri: crm:E12_Production
    description: "Event of creating an architectural structure, murti, or paubha"
    slots:
      - name
      - produced_object
      - carried_out_by
      - used_technique
      - took_place_at
      - has_timespan
      - commissioned_by
      - was_documented_by
      - has_assertion
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  RitualEvent:
    class_uri: crm:E7_Activity
    description: "Intentional ritual activity that activates sacred space, invokes deities, and binds social groups"
    exact_mappings:
      - aat:300055603
    slots:
      - name
      - note
      - ritual_type
      - ritual_on_structure
      - has_timespan
      - lunar_date_tithi
      - recurrence_pattern
      - invokes_deity
      - carried_out_by
      - performed_by_group
      - is_part_of_festival
      - managed_by_guthi
      - was_documented_by
      - has_assertion
      - occurs_before
      - occurs_after
      - used_materials
      - route_places
      - start_place
      - end_place
      - route_description
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  Festival:
    is_a: RitualEvent
    class_uri: heritageGraph:Festival
    description: "Large-scale community ritual event (Jatra) involving processions, music, and collective participation"
    slots:
      - includes_ritual_event
    exact_mappings:
      - crm:E7_Activity
    broad_mappings:
      - prov:Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
  ChariotFestival:
    is_a: Festival
    class_uri: heritageGraph:ChariotFestival
    description: "Festival involving ceremonial chariot procession (e.g., Rato Machhindranath Jatra)"

  MaskedDance:
    is_a: Festival
    class_uri: heritageGraph:MaskedDance
    description: "Festival featuring masked dancers embodying deities (e.g., Kartik Naach)"


  Consecration:
    class_uri: heritageGraph:Consecration
    description: "Ritual event that transforms an object into a sacred vessel (e.g., Prana Pratistha for Murti)"
    slots:
      - name
      - consecrated_object
      - carried_out_by
      - took_place_at
      - has_timespan
      - makes_deity_present
    exact_mappings:
      - crm:E7_Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  Enshrinement:
    class_uri: heritageGraph:Enshrinement
    description: "Event of installing a deity's murti or symbol within a temple sanctum"
    slots:
      - name
      - enshrined_deity
      - enshrined_in_structure
      - carried_out_by
      - has_timespan
    exact_mappings:
      - crm:E7_Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  TransferOfCustody:
    class_uri: crm:E10_Transfer_of_Custody
    description: "Event of transferring responsibility for temple maintenance, ritual performance, or artifact stewardship"
    slots:
      - name
      - transferred_object
      - transferred_from_actor
      - transferred_to_actor
      - transferred_to_guthi
      - took_place_at
      - has_timespan
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  ConditionAssessment:
    class_uri: crm:E14_Condition_Assessment
    description: "Event of evaluating the physical state of a heritage object or structure"
    slots:
      - name
      - assessed_object
      - assessed_condition_state
      - carried_out_by
      - has_timespan
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  ConditionState:
    class_uri: crm:E3_Condition_State
    description: "A physical condition state of a heritage object"
    slots:
      - name
      - note
      - has_condition_type
    mixins:
      - Entity
  Guthi:
    class_uri: crm:E74_Group
    description: "Endowed trust organization unique to Nepal, managing temples, rituals, and land through hereditary
      or voluntary membership"
    slots:
      - name
      - note
      - guthi_type
      - performs_ritual
      - holds_custody_of
      - has_membership
    slot_usage:
      guthi_type:
        range: GuthiType
    broad_mappings:
      - prov:Organization

  # SiGuthi:
  #   is_a: Guthi
  #   class_uri: heritageGraph:SiGuthi
  #   description: "Funeral trust responsible for death rituals and cremation ceremonies"

  # JatraGuthi:
  #   is_a: Guthi
  #   class_uri: heritageGraph:JatraGuthi
  #   description: "Festival trust responsible for organizing and funding annual Jatra events"

  # PujaGuthi:
  #   is_a: Guthi
  #   class_uri: heritageGraph:PujaGuthi
  #   description: "Worship trust responsible for daily puja rituals. Distinct from JatraGuthi."

  # TempleGuthi:
  #   is_a: Guthi
  #   class_uri: heritageGraph:TempleGuthi
  #   description: "Trust managing temple maintenance, daily puja, and priest salaries"

  # NashaGuthi:
  #   is_a: Guthi
  #   class_uri: heritageGraph:NashaGuthi
  #   description: "Music and dance trust (nāsaḥdyaḥ) preserving ritual performance traditions"

  # SanaGuthi:
  #   is_a: Guthi
  #   class_uri: heritageGraph:SanaGuthi
  #   description: "Agricultural cooperative managing communal farmland"

  # SanGuthi:
  #   is_a: Guthi
  #   class_uri: heritageGraph:SanGuthi
  #   description: "Life-cycle ritual trust managing rites of passage"

  # RajGuthi:
  #   is_a: Guthi
  #   class_uri: heritageGraph:RajGuthi
  #   description: "Royal Guthi established by Malla or Shah monarchy (pre-1964)"

    is_a: Actor
  CasteGroup:
    class_uri: heritageGraph:CasteGroup
    description: "Hereditary social group (Jati) with specific ritual roles and occupational duties"
    slots:
      - name
      - note
      - traditional_role
    exact_mappings:
      - crm:E74_Group
    broad_mappings:
      - prov:Organization
    is_a: Actor
  Person:
    class_uri: crm:E21_Person
    description: "Individual person who performs, commissions, documents, or verifies heritage activities"
    slots:
      - id
      - name
      - note
      - birth_timespan
      - death_timespan
      - member_of_group
      - carried_out_activity
      - institutional_affiliation
      - expertise_area
    broad_mappings:
      - prov:Person
    is_a: Actor
  Actor:
    class_uri: crm:E39_Actor
    description: "General actor (person or group) responsible for events"
    slots:
      - name
      - note
    mixins:
      - Agent
  Place:
    class_uri: crm:E53_Place
    description: "Defined geographic location where events occur and structures exist"
    slots:
      - name
      - place_coordinates
      - place_type
      - contains_structure
    mixins:
      - Entity
  TimeSpan:
    class_uri: crm:E52_Time-Span
    description: "Temporal extent of an event or period"
    slots:
      - date_earliest
      - date_latest
      - calendar_system
      - date_precision
    slot_usage:
      calendar_system:
        range: CalendarSystem
      date_precision:
        range: DatePrecision

  # ========================================================================
  # PROVENANCE CLASSES (PROV-O aligned with CIDOC)
  # ========================================================================

    mixins:
      - Entity
  AssertionSubject:
    class_uri: crm:E1_CRM_Entity
    description: "Any HeritageGraph entity or event that may be the subject of an assertion."
    union_of:
      - HumanMadeObject
      - ArchitecturalElement
      - Deity
      - ReligiousTradition
      - HistoricalEvent
      - RitualEvent
      - ConditionState
      - Actor
      - Place
      - TimeSpan
      - DataSource
      - DocumentationActivity
      - SyncreticRelationship
      - KumariTenure
      - Technique
      - Material
      - KumariRole
      - SelectionCriterion
    mixins:
      - Entity
    abstract: true
  Assertion:

    class_uri: crminf:I2_Belief  # ISO standard for arguments
    exact_mappings: []
    description: "A provenance-bearing belief or claim about a heritage entity or event. The assertion is represented
      as CRMinf I2 Belief and as a prov:Entity, allowing source, attribution, generation time, revision, confidence,
      and reconciliation status to be recorded explicitly."
    slots:
      - assertion_content
      - asserts_about
      - confidence_score
      - data_quality_note
      - reconciliation_status
      - supersedes_assertion
      - was_derived_from
      - was_attributed_to
      - was_generated_by
      - generated_at_time
    close_mappings:
      - schema:Claim
    related_mappings:
      - prov:Entity
    annotations:
      crminf_pattern: I2_Belief -J4_that-> I4_Proposition_Set; evidence via I5_Inference_Making 
        (J1_used_as_premise / J2_concluded_that); expert re-check via I7_Belief_Adoption
    mixins:
      - Entity
    slot_usage:
      was_derived_from:
        range: DataSource
        description: Source entities from which this assertion was derived.
      was_attributed_to:
        range: Agent
        description: Agent to whom the assertion is attributed.
      was_generated_by:
        range: DocumentationActivity
        description: Documentation activity that generated the assertion.
  DataSource:
    class_uri: heritageGraph:DataSource
    description: "Original source from which heritage information was derived"
    slots:
      - name
      - datacite_identifier
      - datacite_identifier_type
      - datacite_creator
      - datacite_publisher
      - datacite_resource_type
      - publication_timespan
      - source_citation
      - source_url
      - source_language
      - note
    exact_mappings:
      - crm:E73_Information_Object
    mixins:
      - Entity
  FieldSurveyActivity:
    is_a: DocumentationActivity
    class_uri: crmsci:S4_Observation
    description: "The activity of measuring, photographing, or assessing a site in person."


  OralHistoryInterview:
    is_a: DocumentationActivity
    class_uri: crm:E65_Creation    # The event of creating the interview
    description: "The interaction event between a researcher and a knowledge holder."

  FieldSurveyDataset:
    is_a: DataSource
    class_uri: crm:E31_Document
    description: "The structured data or report resulting from a field survey."

  OralHistoryRecording:
    is_a: DataSource
    class_uri: crm:E33_Linguistic_Object
    description: "The recording or transcript of an oral history interview."


  ArchivalRecord:
    is_a: DataSource
    class_uri: heritageGraph:ArchivalRecord
    description: "Government or institutional administrative record"
    exact_mappings:
      - rico:Record
    broad_mappings:
      - crm:E31_Document

  DocumentationActivity:
    class_uri: heritageGraph:DocumentationActivity
    description: "Activity that records information about a heritage entity or event and may generate information
      objects or assertions. It aligns CIDOC CRM documentation practices with prov:Activity."


    slots:
      - name
      - documents
      - was_associated_with
      - used_method
      - used_equipment
      - generated
      - has_timespan
    exact_mappings:
      - crm:E7_Activity
    annotations:
      prov_alignment_note: prov:Activity alignment is a HeritageGraph project-level assertion (not a normative
        CIDOC axiom; no official CRM<->PROV mapping exists). Asserted on this class, not on crm:E7_Activity 
        globally.
    mixins:
      - Activity
  InformationObject:
    is_a: DataSource
    class_uri: crm:E73_Information_Object
    description: "A recorded piece of information about heritage"
    slots:
