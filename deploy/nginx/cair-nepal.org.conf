# Example cair-nepal.org server blocks wiring in the HeritageGraph rules.
# Adapt certificate paths and merge with the existing site configuration.
#
# The HeritageGraph IRIs are minted as https://cair-nepal.org/heritagegraph/...;
# they are served over https. A request to the http form is redirected to the
# same path over https (301), where content negotiation answers with a 303.

include /etc/nginx/heritagegraph/heritagegraph-maps.conf;

server {
    listen 80;
    listen [::]:80;
    server_name cair-nepal.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cair-nepal.org;

    ssl_certificate     /etc/letsencrypt/live/cair-nepal.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cair-nepal.org/privkey.pem;

    include /etc/nginx/heritagegraph/heritagegraph-locations.conf;

    # ... existing cair-nepal.org locations ...
}
