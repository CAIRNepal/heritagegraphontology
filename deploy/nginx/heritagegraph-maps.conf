# HeritageGraph content negotiation — http{} context.
# Include once inside the http { } block (e.g. /etc/nginx/conf.d/), before the
# server block that includes heritagegraph-locations.conf.
#
# Requested format, from the Accept header. nginx maps test regexes in order and
# do not weigh q-values: a request naming text/html (every browser) gets HTML;
# otherwise the first RDF media type found wins; anything else (incl. */*)
# gets HTML.
map $http_accept $hg_format {
    default                    html;
    ~*text/html                html;
    ~*application/xhtml\+xml   html;
    ~*text/turtle              ttl;
    ~*application/x-turtle     ttl;
    ~*application/rdf\+xml     owl;
    ~*application/ld\+json     jsonld;
    ~*application/n-triples    nt;
}

# Current release: documentation page or serialization.
map $hg_format $hg_current {
    html    /heritagegraph/docs/;
    ttl     /heritagegraph/docs/ontology.ttl;
    owl     /heritagegraph/docs/ontology.owl;
    jsonld  /heritagegraph/docs/ontology.jsonld;
    nt      /heritagegraph/docs/ontology.nt;
}

# File inside docs/releases/<version>/ ("" = that release's index.html).
map $hg_format $hg_release_file {
    html    "";
    ttl     ontology.ttl;
    owl     ontology.owl;
    jsonld  ontology.jsonld;
    nt      ontology.nt;
}
