# HeritageGraph IRIs under http://cair-nepal.org/heritagegraph/ — server{} context.
# Include inside the cair-nepal.org server block. Requires heritagegraph-maps.conf
# in the http{} context.
#
#   /heritagegraph/ and /heritagegraph/ontology        current release (conneg)
#   /heritagegraph/ontology/<version>                  that release's files (conneg)
#   /heritagegraph/<Term>                              HTML: docs anchor #<Term>;
#                                                      RDF:  current release
#   /heritagegraph/scheme/<Enum>                       HTML: docs anchor #scheme/<Enum>
#   /heritagegraph/docs/...                            static site (the repo's docs/)
#
# Enumeration individuals are hash IRIs (.../ConditionType#Damaged); the
# fragment never reaches the server, so they resolve like their enumeration
# class (.../ConditionType), whose documentation lists the values.
#
# Deploy the repository's docs/ directory (WIDOCO site, serializations, and
# docs/releases/<version>/) to /srv/heritagegraph/docs/ — or change the alias.

# Location headers stay relative, so the rules also work behind a proxy / on a
# test port.
absolute_redirect off;

location = /heritagegraph {
    return 301 /heritagegraph/;
}

# Namespace root and ontology IRI.
location ~ ^/heritagegraph/(ontology)?$ {
    add_header Vary Accept always;
    return 303 $hg_current;
}

# Version IRIs: the exact release's files.
location ~ ^/heritagegraph/ontology/(?<hg_version>[0-9][0-9A-Za-z.\-]*)$ {
    add_header Vary Accept always;
    return 303 /heritagegraph/docs/releases/$hg_version/$hg_release_file;
}

# Static documentation site and serializations.
location = /heritagegraph/docs {
    return 301 /heritagegraph/docs/;
}
location ^~ /heritagegraph/docs/ {
    alias /srv/heritagegraph/docs/;
    index index.html;
    types {
        text/html               html;
        text/css                css;
        application/javascript  js mjs;
        application/json        json;
        image/svg+xml           svg;
        image/x-icon            ico;
        text/plain              txt md;
        text/turtle             ttl;
        application/rdf+xml     owl rdf;
        application/ld+json     jsonld;
        application/n-triples   nt;
    }
    charset utf-8;
    charset_types text/css text/plain text/turtle application/n-triples
                  application/ld+json application/json application/javascript;
}

# Concept schemes of the enumerations.
location ~ ^/heritagegraph/scheme/(?<hg_scheme>[A-Za-z][A-Za-z0-9_\-]*)$ {
    add_header Vary Accept always;
    if ($hg_format = html) {
        return 303 /heritagegraph/docs/#scheme/$hg_scheme;
    }
    return 303 $hg_current;
}

# Class, property, and enumeration IRIs.
location ~ ^/heritagegraph/(?<hg_term>[A-Za-z][A-Za-z0-9_\-]*)$ {
    add_header Vary Accept always;
    if ($hg_format = html) {
        return 303 /heritagegraph/docs/#$hg_term;
    }
    return 303 $hg_current;
}
